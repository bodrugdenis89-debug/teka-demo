<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Teka — учёт</title>
<link rel="icon" href="assets/teka-logo-sq.svg">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="/manifest-uchet.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEKA учёт">
<style>
:root{--red:#E30613;--ink:#141414;--ink2:#3a3a3a;--mute:#767676;--line:#E6E6E6;--soft:#F5F5F5;--ok:#1A7F37;--warn:#B26B00;--bg:#fff;--cl:#FDECEC;--rs:#FFF7CC}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:500 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.btn{height:46px;padding:0 18px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#bbb}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.s{height:38px;padding:0 14px;font-size:15px}
input.t,select.t{height:46px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff}
input.t:focus,select.t:focus{outline:2px solid #111;outline-offset:-1px;border-color:transparent}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap;max-width:1400px;margin:0 auto}.hb .sp{flex:1}.plg{display:flex;align-items:center;gap:4px;font-weight:600}.plg span{margin-right:4px;color:var(--mute)}.plg button{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-weight:700;background:#fff}.plg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rate{display:flex;align-items:center;gap:8px;font-weight:600}.rate input{width:110px;font-weight:700;text-align:center}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.lg b{background:var(--red);color:#fff;border-radius:6px;padding:4px 8px;letter-spacing:.04em}
.lg em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:4px;padding:2px 6px}
.tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto;max-width:1400px;margin:0 auto}
.tabs button{font-size:18px;padding:12px 18px 14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tabs button i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;font-size:14px;padding:1px 8px;margin-left:6px}
.note{max-width:1360px;margin:14px max(20px,calc((100% - 1360px)/2)) 0;padding:10px 14px;border-radius:10px;background:#FFF8E6;color:#6b4a00;font-size:15px}
main{padding:16px 20px 100px;max-width:1400px;margin:0 auto}
h3{font-size:19px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row .sp{flex:1}
.chip{height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:16px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;opacity:.6;margin-left:4px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.k:hover{border-color:#bbb}
.k small{display:block;color:var(--mute);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.k strong{display:block;font-size:32px;line-height:1.2;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.k span{color:var(--mute);font-size:15px}
.k select{border:0;background:none;font:inherit;color:var(--mute);font-weight:600;font-size:14px;text-transform:uppercase;padding:0;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:hidden}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#fafafa;text-align:left;font-size:15px;color:var(--mute);font-weight:600;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.cn{text-align:center}
tr.u td{background:#fafafa;font-size:16px;padding-top:9px;padding-bottom:9px}
tr.u.rs td{background:var(--rs)}tr.u.cl td{background:var(--cl)}tr.u.cx td{color:#aaa}
td.ui{padding-left:40px}
tr.c.u:hover td{background:#f0f0f0}
tr.c{cursor:pointer}
tr.c:hover td{background:#fafafa}
tr.cl td{background:var(--cl)}
tr.cl:hover td{background:#fbe0e0}
tr.cx td{color:#aaa;text-decoration:line-through}
tr.rs td{background:var(--rs)}
tr.sub td{background:#fbfbfb;padding:0}
.n{text-align:right;white-space:nowrap}
.mu{color:var(--mute)}
.b{display:inline-block;border-radius:6px;padding:2px 9px;font-size:15px;font-weight:700;white-space:nowrap}
.b.o{background:#eef;color:#33489b}.b.d{background:#FDE7E7;color:#B4141B}.b.w{background:#FFF1D6;color:#8a5300}.b.z{background:#E6F4EA;color:var(--ok)}.b.x{background:#eee;color:#888}.b.y{background:#FFF1A8;color:#6b5600}
.spr{color:var(--warn);font-weight:700}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f2f2f2;cursor:pointer}
.li:last-child{border:0}
.li:hover b{color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;justify-content:flex-end}
.dr{background:#fff;width:min(640px,100%);height:100%;overflow:auto;padding:20px}
.dr h2{font-size:26px;margin-bottom:4px}
.dl{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;margin:14px 0}
.dl dt{color:var(--mute)}
.dl dd{font-weight:600}
.md{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mb{background:#fff;border-radius:14px;padding:20px;max-height:92vh;overflow:auto;width:min(480px,100%);display:grid;gap:14px}
.mb label{display:grid;gap:6px;font-size:16px;color:var(--mute);font-weight:600}
.mb input,.mb select{width:100%}
.pbx{display:inline-flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;z-index:40;font-size:17px;font-weight:600}
@media(max-width:900px){.kp{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.hb,.tabs,main{padding-left:16px;padding-right:16px}.note{margin:12px 16px 0}.kp{grid-template-columns:1fr}.hide-m{display:none}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.back{height:42px;display:inline-flex;align-items:center;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:8px;font-weight:700;text-decoration:none;color:var(--ink);background:#fff}
.back:hover{border-color:#bbb}
.sync{font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.w{color:var(--warn)}.sync.er{color:var(--red)}
.sync.ok:before{content:"✓ "}
.tabs .ti{display:none}
header{position:static}
.tbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.imp{max-width:560px;margin:40px auto;display:grid;gap:14px;justify-items:start}
@media(max-width:700px){
body{font-size:16px}
header{position:static}
.hb{gap:10px;padding:10px 16px}
.hb .sp{display:none}
.lg{font-size:18px}
.sync{margin-left:auto}
.plg span{display:none}
.plg,.rate{flex:1 1 auto}
.plg button{height:40px;flex:1}
.rate{justify-content:flex-end;font-size:15px}.rate input{width:84px;height:40px}
.tbar{top:env(safe-area-inset-top,0px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.tabs{display:flex;gap:0;padding:0;max-width:none;overflow:visible}
.tabs button{flex:1 1 auto;padding:8px 2px 9px;border-bottom:3px solid transparent;position:relative;min-width:0}
.tabs button.on{border-bottom-color:var(--red);color:var(--red);background:#FFF5F5}
.tabs button i{position:absolute;top:2px;right:4px;font-size:11px;padding:0 6px;margin:0}
main{padding:14px 12px 110px}
.toast{max-width:calc(100vw - 32px);text-align:center}
.row{gap:8px}
.row input.t{width:100%!important;flex:1 1 100%}
.row select.t{flex:1 1 auto;min-width:0;max-width:100%}
.row>.mu{flex:1 1 100%;font-size:15px}
.chip{height:40px;padding:0 13px;font-size:15px}
.k strong{font-size:28px}
.dl{grid-template-columns:118px minmax(0,1fr)}
.dr{padding:16px}.dr h2{font-size:22px}
.tw.mt{overflow:visible;background:none;border:0}
.mt table,.mt tbody{display:block}
.mt thead{display:none}
.mt tr{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:4px 10px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.mt td{display:block;padding:0;border:0;background:none!important;text-align:left;font-size:16px;min-width:0;overflow-wrap:anywhere}
.mt td.n,.mt td.cn{text-align:left}
.mt td:empty{visibility:hidden}
.mt td:first-child{grid-column:1/-1}
.mt td[colspan]{grid-column:1/-1}
.mt td.hide-m{display:none}
.mt td.n{white-space:nowrap;font-size:15.5px}
.mt td:before{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--mute);font-size:13px;font-weight:600;line-height:1.3}
.mt tr.u{margin:-4px 0 8px 14px;background:#fafafa;border-radius:10px}
.mt tr.u+tr.u{margin-top:-4px}
.mt tr.rs{background:var(--rs)}.mt tr.cl{background:var(--cl)}
.mt td.ui{padding-left:0}
.mt .btn.s{height:36px}
/* заказы */
.to tr{--n:3}
.to td:nth-child(1){grid-column:1;grid-row:1;font-size:17px}
.to td:nth-child(2){grid-column:2;grid-row:1;color:var(--mute);align-self:center}
.to td:nth-child(9){grid-column:3;grid-row:1;justify-self:end}
.to td:nth-child(3){grid-column:1/-1;grid-row:2;color:var(--ink2)}
.to td:nth-child(3):empty{display:none}
.to td:nth-child(3):before{content:"Мебельщик";display:inline;margin-right:6px}
.to td:nth-child(4){grid-column:1/-1;grid-row:3;font-weight:700}
.to td:nth-child(6){grid-column:1;grid-row:4}.to td:nth-child(7){grid-column:2;grid-row:4}.to td:nth-child(8){grid-column:3;grid-row:4}
.to td:nth-child(6):before{content:"Сумма"}.to td:nth-child(7):before{content:"Оплачено"}.to td:nth-child(8):before{content:"Долг"}
.to td:nth-child(8) b{color:var(--red)}
/* склад */
.ts tr{grid-template-columns:repeat(3,minmax(0,1fr))}
.ts td:nth-child(6){grid-column:1/-1!important}
.mt td.spr{white-space:normal}
.mt td{white-space:normal}
.ts thead{display:block;margin-bottom:10px}
.ts thead tr{display:flex;flex-wrap:wrap;gap:6px;padding:0;background:none;border:0;margin:0}
.ts th{position:static;display:block;border:1px solid var(--line);border-radius:18px;background:#fff;padding:7px 12px;font-size:14px}
.ts th.hide-m{display:none}
.ts thead:before{content:"Сортировка:";display:block;color:var(--mute);font-size:14px;font-weight:600;margin-bottom:6px}
.ts td:nth-child(3):before{content:"Всего"}.ts td:nth-child(4):before{content:"Свободно"}.ts td:nth-child(5):before{content:"В брони"}.ts td:nth-child(6):before{content:"Себестоимость"}
.ts td:nth-child(6){grid-column:span 1}
.ts tr:has(td[colspan]){background:none;border:0;padding:14px 2px 4px;margin:0}
.ts td[colspan]{background:none!important;padding:0!important;font-size:18px}
.ts td.spr{font-size:15px}
/* дизайнеры и мебельщики */
.tdz tr{--n:2}
.tdz td:empty,.tp td:empty{display:none}
.tdz td:nth-child(2):before{content:"Заказов"}.tdz td:nth-child(4):before{content:"Выплачено"}.tdz td:nth-child(5):before{content:"К выплате"}.tdz td:nth-child(6):before{content:"Ожидается"}
.tdz tr.u td:nth-child(2):before{content:"Статус"}
.tdz tr.u:has(td[colspan]) {padding:8px 12px}
.tp tr{grid-template-columns:minmax(0,.6fr) minmax(0,1fr) minmax(0,1fr)}
.tp td:nth-child(2):before{content:"Заказов"}.tp td:nth-child(3):before{content:"Оборот"}.tp td:nth-child(4):before{content:"Должен"}
.tp tr.u td:nth-child(2):before{content:"Статус"}.tp tr.u td:nth-child(3):before{content:"Сумма"}.tp tr.u td:nth-child(4):before{content:"Долг"}

/* крупнее для Лилиана */
body{font-size:18px}
.tabs .ti{display:block;width:30px;height:30px;margin:0 auto 4px}
.tabs button{font-size:15px;letter-spacing:-.02em;line-height:1.15;font-weight:700}
.tabs button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button i{top:3px;right:calc(50% - 30px);font-size:12px;padding:1px 6px}
main{padding-bottom:60px}
.toast{bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:18px}
.back{height:46px;font-size:17px}.lg{font-size:20px}.sync{font-size:15px}
.plg button{height:46px;font-size:17px}.rate{font-size:17px}.rate input{height:46px;font-size:18px;width:92px}
.btn{height:50px;font-size:17px}.btn.s{height:44px;font-size:16px}
input.t,select.t{height:50px;font-size:18px}
.chip{height:46px;font-size:17px;padding:0 15px}
.k small{font-size:15px}.k strong{font-size:34px}.k span{font-size:16px}
h3{font-size:21px}
.mt tr{padding:14px 16px;gap:6px 12px}
.mt td{font-size:18px}
.mt td.n{font-size:18px}
.mt td:before{font-size:14.5px}
.b{font-size:16px;padding:3px 10px}
.to td:nth-child(1){font-size:20px}
.to td:nth-child(4){font-size:19px}
.ts td[colspan]{font-size:21px}
.ts th{font-size:16px;padding:9px 14px}
.ts td.spr{font-size:17px}
.li{font-size:18px;padding:13px 0}
.dr{font-size:18px}.dr h2{font-size:25px}.dl{grid-template-columns:130px minmax(0,1fr)}
.mb label{font-size:17px}
}
/* выбор модели в приходе */
.pk{display:grid;gap:8px}
.pkc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.pkc::-webkit-scrollbar{display:none}.pkc .chip{flex:none}
.pkl{max-height:min(44vh,360px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.pkl[hidden]{display:none}
.pkh{padding:8px 12px 4px;font-size:14px;font-weight:700;color:var(--mute);background:#f6f6f6;position:sticky;top:0}
.pki{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 12px;font:inherit;cursor:pointer}
.pki b{display:block;font-size:17px;color:var(--ink)}.pki span{font-size:14px;color:var(--mute)}
.pki:active,.pki.on{background:#FFF5F5}.pki.new{color:var(--red)}.pki.new b{display:inline}
/* цвет статуса у дизайнеров и мебельщиков */
tr.k-due>td:first-child{box-shadow:inset 5px 0 0 var(--red)}
tr.k-wait>td:first-child{box-shadow:inset 5px 0 0 var(--warn)}
tr.k-ok>td:first-child{box-shadow:inset 5px 0 0 var(--ok)}
tr.k-due{background:#FFF1F1}tr.k-wait{background:#FFF8EB}tr.k-ok{background:#F1F9F3}
.tdz tr.c:not(.u)>td:nth-child(4){color:var(--ok);font-weight:700}
.tdz tr.c:not(.u)>td:nth-child(6){color:var(--warn);font-weight:700}
@media (max-width:700px){
.mt tr.k-due,.mt tr.k-wait,.mt tr.k-ok{border-left-width:6px}
.mt tr.k-due{border-left-color:var(--red)}.mt tr.k-wait{border-left-color:var(--warn)}.mt tr.k-ok{border-left-color:var(--ok)}
.mt tr.k-due>td:first-child,.mt tr.k-wait>td:first-child,.mt tr.k-ok>td:first-child{box-shadow:none}
}
/* вкладки: переезжающая плашка + анимация иконок */
.tabs{position:relative}
.tabs .tind{position:absolute;left:0;bottom:0;height:100%;width:0;pointer-events:none;background:#FFF5F5;border-bottom:3px solid var(--red);transition:transform .38s cubic-bezier(.3,1.3,.5,1),width .38s cubic-bezier(.3,1.3,.5,1);z-index:0}
.tabs button{position:relative;z-index:1;background:none!important;border-bottom-color:transparent!important;transition:color .25s}
.tabs .ti .f{fill:transparent;transition:fill .3s}
.tabs button.on .ti .f{fill:rgba(227,6,19,.12)}
.tabs button:active .ti{transform:scale(.88)}
.tabs .ti{transition:transform .15s;overflow:visible}
.tabs .ti *{transform-box:fill-box}
.go .ti-sum .ln{stroke-dasharray:24;animation:tkDraw .6s ease-out}
@keyframes tkDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.go .ti-ord{animation:tkHop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes tkHop{0%{transform:translateY(0)}35%{transform:translateY(-5px) rotate(-4deg)}70%{transform:translateY(1px)}100%{transform:none}}
.go .ti-stk .bx{animation:tkDrop .45s cubic-bezier(.3,1.4,.5,1) backwards}
.go .ti-stk .bx:nth-of-type(2){animation-delay:.08s}.go .ti-stk .bx:nth-of-type(3){animation-delay:.16s}
@keyframes tkDrop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.go .ti-des .pn{transform-origin:0 100%;animation:tkWrite .6s ease-in-out}
@keyframes tkWrite{0%,100%{transform:none}25%{transform:rotate(-10deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-4deg)}}
.go .ti-par .d1{transform-origin:0 50%;animation:tkDoor .6s ease-in-out}
.go .ti-par .d2{transform-origin:100% 50%;animation:tkDoor .6s ease-in-out .05s}
@keyframes tkDoor{0%,100%{transform:none}40%{transform:scaleX(.35)}}
.tabs button i.bmp{animation:tkPulse .5s ease-out}
@keyframes tkPulse{40%{transform:scale(1.35)}}
.sync.flash{animation:tkFlash .7s ease-out}
@keyframes tkFlash{0%{background:rgba(26,127,55,.18);transform:scale(1.06)}100%{background:transparent;transform:none}}
.sync{border-radius:8px;padding:2px 6px}
@media (prefers-reduced-motion:reduce){.tabs .tind,.go .ti *,.go .ti,.bmp,.sync.flash{animation:none!important;transition:none!important}}
/* логотип: бегущая полоска = сохранение */
@property --tka{syntax:'<angle>';inherits:false;initial-value:0deg}
.lg b{position:relative;isolation:isolate;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%) var(--red) no-repeat;background-size:250% 100%;background-position:150% 0}
.lg b:before{content:"";position:absolute;inset:-4px;border-radius:10px;padding:2.5px;background:conic-gradient(from var(--tka),transparent 0deg 200deg,rgba(227,6,19,.25) 250deg,#ff3b47 320deg,#ffd0d3 352deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
@keyframes tkSpin{to{--tka:360deg}}
.lg.w b:before{opacity:1;animation:tkSpin .9s linear infinite}
.lg.ok b:before{animation:tkSpin 1.4s cubic-bezier(.4,0,.2,1) 1,tkFade 1.4s ease-in 1 forwards}
@keyframes tkFade{0%,60%{opacity:1}100%{opacity:0}}
.lg.ok b{animation:tkShine .9s ease-out 1.1s 1 both}

  S=U.filter(s=>!s.out);OUT=U.filter(s=>s.out);

    o.items=S.filter(s=>s.res&&key(s.res)===o.k&&o.k);

    x.min=c.length?Math.min(...c):0;x.max=c.length?Math.max(...c):0;x.avg=x.u.reduce((a,s)=>a+s.qty*(s.cost||0),0)/x.qty;

function addModal(){
  const mm={};S.forEach(s=>{const k=nm(s.model),x=mm[k]||(mm[k]={m:s.model,cat:catOf(s),q:0,c:0});x.q+=s.qty||1;if(s.inv)x.c=s.inv});
  const sig=t=>{t=String(t).toUpperCase();return [...t.replace(/[^A-Z0-9]/g,'')].sort().join('')+'|'+(t.match(/\d+/g)||[]).join('.')};
  const have=new Set(Object.values(mm).map(x=>sig(x.m)));
  const code=t=>{const m=String(t).match(/([A-Za-z]{1,5})\s*-?\s*(\d{2,5})/);return m?m[1].toUpperCase()+m[2]:''};
  const byCode={};Object.values(mm).forEach(x=>{const c=code(x.m);if(c)(byCode[c]=byCode[c]||[]).push(x.m)});
  (CATL||[]).forEach(c=>{const k=nm(c.m),g=sig(c.m);if(!mm[k]&&!have.has(g)){mm[k]={m:c.m,cat:c.cat,q:0,c:0,p:c.p,site:1,like:byCode[code(c.m)]||null};have.add(g)}});
  const all=Object.values(mm).sort((a,b)=>CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||(a.site||0)-(b.site||0)||a.m.localeCompare(b.m));
  if(!CATL)loadCat().then(()=>{const I=document.getElementById('am');if(I&&!I.value){[...document.querySelectorAll('.md')].pop().remove();addModal()}});
  const cats=CATS.filter(c=>all.some(x=>x.cat===c));
  modal('Приход товара',`<div class="pk"><label>Модель<input class="t" id="am" placeholder="Поиск или новая модель" autocomplete="off" autocapitalize="characters"></label>
  <div class="pkc" id="pkc"><button class="chip on" data-pc="">Все</button>${cats.map(c=>`<button class="chip" data-pc="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="pkl" id="pkl"></div></div>
  <label>Количество<input class="t" id="aq" type="number" inputmode="numeric" value="1" min="1"></label>
  <label>Цена из инвойса за штуку, € <small>(себестоимость = ×${KF()})</small><input class="t" id="ac" type="number" inputmode="decimal" step="0.01"></label>
  <label>Категория<select class="t" id="acat"><option value="">Определить по модели</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
  <label>Куда<select class="t" id="al"><option value="dep">Склад</option><option value="salon">Салон</option><option value="showroom">Шоурум</option></select></label>`,()=>{
    const m=document.getElementById('am').value.trim(),q=+document.getElementById('aq').value||1,c=+document.getElementById('ac').value||0;
    if(!m||!c){toast('Укажите модель и цену');return false}
    ST.add.push({loc:document.getElementById('al').value,cat:document.getElementById('acat').value||guessCat(m),model:m,qty:q,cost:c,res:null,note:'приход '+new Date().toLocaleDateString('ru-RU'),used:false});
    save();build();F.sq=m;F.open[nm(m)]=1;render();toast('Партия добавлена')});
  const I=document.getElementById('am'),PL=document.getElementById('pkl'),PC=document.getElementById('pkc');let pc='',pick=null;
  const norm=t=>String(t).toLowerCase().replace(/[\s\-_.\/]+/g,'');
  function draw(){
    const q=I.value.trim().toLowerCase(),ws=q.split(/\s+/).filter(Boolean).map(norm);
    let r=all.filter(x=>(!pc||x.cat===pc)&&ws.every(w=>norm(x.m).includes(w)));
    const n=r.length;r=r.slice(0,80);let last='';
    const nw=q&&!all.some(x=>nm(x.m)===nm(I.value))?`<button class="pki new" data-new>+ Новая модель: <b>${esc(I.value.trim())}</b></button>`:'';
    PL.innerHTML=
      r.map(x=>{const h=!pc&&!q&&x.cat!==last?`<div class="pkh">${esc(x.cat)}</div>`:'';last=x.cat;return h+`<button class="pki${pick===x?' on':''}" data-m="${esc(x.m)}"><b>${esc(x.m)}</b><span>${[pc?'':esc(x.cat),x.site?'<em class="site">с сайта</em>'+(x.p?' '+L(x.p):''):'',x.c?x.c.toFixed(2)+' €':'',x.q?x.q+' шт на складе':''].filter(Boolean).join(' · ')}</span>${x.like?`<small class="like">похожие на складе: ${x.like.slice(0,3).map(esc).join(', ')}</small>`:''}</button>`}).join('')+
      (n>r.length?`<div class="pkh">ещё ${n-r.length} — уточните поиск</div>`:'')+(!n&&!q?'<div class="pkh">Нет моделей</div>':'')+nw;
  }
  I.oninput=()=>{pick=null;PL.hidden=false;draw()};
  PC.onclick=e=>{const b=e.target.closest('[data-pc]');if(!b)return;pc=b.dataset.pc;PC.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));PL.hidden=false;draw()};
  PL.onclick=e=>{const b=e.target.closest('.pki');if(!b)return;
    if(b.dataset.new!==undefined){pick=null;PL.hidden=true;document.getElementById('aq').focus();return}
    pick=all.find(x=>x.m===b.dataset.m);I.value=pick.m;document.getElementById('acat').value=pick.cat;if(pick.c&&!document.getElementById('ac').value)document.getElementById('ac').value=pick.c;
    PL.hidden=true;I.blur();toast('Выбрано: '+pick.m)};
  I.onfocus=()=>{PL.hidden=false;draw()};
  draw();
}

/* файл → base64; фото уменьшаем до 2000px */
function fileB64(f){
  const rd=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
  if(!/^image\//.test(f.type))return rd(f).then(data=>({data,type:'application/pdf'}));
  return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>rd(b).then(data=>ok({data,type:'image/jpeg'}),no),'image/jpeg',0.85)};im.onerror=()=>no(new Error('Не удалось открыть фото'));im.src=u})
}
/* строка инвойса: «1 111000010 HLB 8600 BK Pcs 3 Spania 378.00 1,134.00 0.00» или из Excel через табуляцию */
function parseInv(t){
  const num=v=>+String(v).replace(/\s/g,'').replace(/,(?=\d{3}\b)/g,'').replace(',','.');
  return String(t).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/(?:^|\s)(\d{8,9})\s+(.+?)\s+(?:pcs|buc|шт)\.?\s+(\d+)\s+(?:[A-Za-zА-Яа-яăâîșțĂÂÎȘȚ]+\s+)?([\d.,]+)\s+([\d.,]+)(?:\s+[\d.,]+)?$/i);
    if(m)return {s:m[1],m:m[2].trim(),q:+m[3],p:num(m[4])};
    const c=l.split('\t').map(x=>x.trim());const i=c.findIndex(x=>/^\d{8,9}$/.test(x));if(i<0)return null;
    const ns=c.slice(i+1).filter(x=>/^[\d\s.,]+$/.test(x)&&x);if(ns.length<2)return null;
    const q=+ns.find(x=>/^\d+$/.test(x)),p=num(ns.find(x=>/[.,]\d{2}$/.test(x))||ns[1]);
    return q&&p?{s:c[i],m:(c[i+1]||'').trim(),q,p}:null}).filter(Boolean);
}

    L=A.filter(p=>!pr||inPer(p.d,pr)).filter(p=>!PF.s||(PF.s==='f'?p.f:PF.s==='r'?p.r:!p.f&&!p.r)).filter(p=>!q||(p.no+' '+p.note+' '+p.L.map(x=>x.model+' '+(x.sku||'')).join(' ')).toLowerCase().includes(q));
    const st=x=>x.out?'<span class="b z">выдан</span>':x.res?`<span class="b y">бронь ${esc(x.res)}</span>`:'<span class="b o">на складе</span>';
    PB.innerHTML=(A.length?`<p class="mu" style="margin:0 0 8px">${L.length} из ${A.length} закупок · ${L.reduce((a,p)=>a+p.q,0)} шт · по инвойсам ${E(L.reduce((a,p)=>a+p.inv,0),2)} · себест. ${E(L.reduce((a,p)=>a+p.c,0),2)}</p>`:'')+(L.length?`<div class="tw"><table class="byt pl"><thead><tr><th>Инвойс</th><th>Дата</th><th class="n">Позиций</th><th class="n">Шт</th><th class="n">По инвойсу, €</th><th class="n">Себест., €</th><th>Состояние</th><th></th></tr></thead><tbody>${L.map((p,i)=>`<tr class="plr"><td><b>${esc(p.no||(/^приход/.test(p.note)?'вручную':'без номера'))}</b></td><td>${p.d?dt(p.d):''}</td><td class="n">${p.L.length}</td><td class="n">${p.q}</td><td class="n">${E(p.inv,2)}</td><td class="n">${E(p.c,2)}</td><td>${p.f?`<span class="b o">${p.f} на складе</span> `:''}${p.r?`<span class="b y">${p.r} в брони</span> `:''}${p.o?`<span class="b z">${p.o} выдано</span>`:''}</td><td style="white-space:nowrap"><button class="btn s" type="button" data-po="${i}">Состав</button> <button class="btn s" type="button" data-pe="${i}">Изменить</button> <button class="btn s" type="button" data-pd="${i}" style="color:var(--red)">Удалить</button></td></tr>
    <tr class="pld" data-pl="${i}" hidden><td colspan="8"><table class="pli">${p.L.map(x=>`<tr><td>${esc(x.model)}</td><td>${loc(x.loc)}</td><td class="n">${x.qty} шт</td><td class="n">${E(x.inv,2)} → ${E(x.cost,2)}</td><td>${st(x)}</td></tr>`).join('')}</table></td></tr>`).join('')}</tbody></table></div>`:`<p class="mu">${A.length?'По этим фильтрам закупок нет.':'Закупок пока нет.'}</p>`)}
  bar();draw();
  let qt;FB.addEventListener('input',e=>{if(e.target.id==='plq'){clearTimeout(qt);qt=setTimeout(()=>{PF.q=e.target.value;draw()},200)}});
  FB.addEventListener('tkper',e=>{const d=e.detail;if(d.id==='plp'){PF.p=d.v;PF.a=d.a;PF.b=d.b;bar();draw()}});
  FB.addEventListener('change',e=>{const id=e.target.id;if(id==='plp'){PF.p=e.target.value;bar();draw()}if(id==='plp1'){PF.a=e.target.value;draw()}if(id==='plp2'){PF.b=e.target.value;draw()}});
  FB.addEventListener('click',e=>{const c=e.target.closest('[data-ps]');if(c){PF.s=c.dataset.ps;bar();draw()}});
  PB.addEventListener('click',e=>{const o=e.target.closest('[data-po]'),d=e.target.closest('[data-pd]');
    if(o){const r=md.querySelector(`[data-pl="${o.dataset.po}"]`);r.hidden=!r.hidden;o.textContent=r.hidden?'Состав':'Скрыть'}
    if(d){md.remove();delPurchase(L[+d.dataset.pd].L[0])}
    const ee=e.target.closest('[data-pe]');if(ee){const p=L[+ee.dataset.pe];
      md.remove();buyModal({no:p.no,d:p.d||isoNow(),free:p.L.filter(x=>!x.out&&!x.res),lock:p.L.filter(x=>x.out||x.res)})}});
  md.querySelector('[data-pn]').onclick=()=>{md.remove();buyModal()};
}


(function(){const B=document.getElementById('cfgb'),P=document.getElementById('cfg');
const set=o=>{P.hidden=!o;B.classList.toggle('on',o);B.setAttribute('aria-expanded',o)};
B.addEventListener('click',e=>{e.stopPropagation();set(P.hidden)});
P.querySelector('.cfx').addEventListener('click',()=>set(false));
document.addEventListener('click',e=>{if(!P.hidden&&!P.contains(e.target))set(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!P.hidden)set(false)});})();

</script>
