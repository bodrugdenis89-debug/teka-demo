<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Teka — админка</title>
<link rel="icon" href="assets/teka-logo-sq.svg">
<style>
:root{--red:#E30613;--ink:#141414;--ink2:#3a3a3a;--mute:#767676;--line:#E6E6E6;--soft:#F5F5F5;--ok:#1A7F37;--warn:#B26B00;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:500 14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.btn{height:38px;padding:0 16px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#bbb}
a.btn{text-decoration:none}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.r:hover{background:#c40511}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input.t,select.t,textarea.t{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;width:100%}
textarea.t{height:auto;padding:10px 12px;resize:vertical;min-height:90px}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid #111;outline-offset:-1px;border-color:transparent}
/* вход */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--soft);z-index:50}
#login[hidden]{display:none}
#login form{background:#fff;border-radius:16px;padding:36px;width:min(360px,92vw);display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
#login img{width:76px;height:76px;justify-self:start}
#login h1{font-size:20px}
#login .er{color:var(--red);min-height:20px;font-size:13px}
/* шапка */
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.hb .lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-right:8px}
.hb .lg img{width:64px;height:64px;margin:-12px 0 -12px -20px;align-self:flex-start}
.hb .lg{align-self:stretch;align-items:center}
.hb .q{flex:1 1 260px;max-width:420px}
.hb .sp{flex:1}
.hb select.t{width:auto;min-width:150px}
/* выпадающие списки */
.dd{position:relative}
.dd>button{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 38px 0 14px;font-weight:600;min-width:180px;text-align:left;position:relative;white-space:nowrap;width:100%}
.dd>button:hover{border-color:#bbb}
.dd>button:after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.dd.on>button{border-color:var(--ink)}
.dd.on>button:after{transform:translateY(-20%) rotate(-135deg)}
.dd ul{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.13);padding:6px;list-style:none;z-index:40;display:none;max-height:70vh;overflow:auto}
.dd.on ul{display:block}
.dd li{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;white-space:nowrap}
.dd li:hover{background:var(--soft)}
.dd li span{flex:1}
.dd li small{color:var(--mute);font-weight:600;font-size:12.5px;background:var(--soft);border-radius:20px;padding:1px 8px}
.dd li:hover small{background:#fff}
.dd li.sel{color:var(--red);font-weight:700}
td.st .dd>button,#ed .dd>button,#tl .dd>button{min-width:0}
td.st .dd>button{height:34px;width:140px;font-weight:600}
td.st .dd.order>button,td.st .dd.out>button{color:var(--warn);border-color:#f0d9b5;background:#FFFAF0}
#ed .dd>button,#tl .dd>button{font-weight:500}
.dd li.sel:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:-10px;flex:none}
/* таблица */
main{padding:16px 20px 120px}
#tw{overflow-x:auto;border-radius:12px}
.sum{color:var(--mute);margin:0 0 10px 2px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:10px 10px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.dz td{background:#FFF8E6}
tr.hd td{opacity:.55}
tr.hd td:last-child,tr.hd td:nth-last-child(2){opacity:1}
td.ph{width:64px}
td.ph img{width:52px;height:52px;object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--line);display:block}
td.nm b{display:block;font-size:14.5px}
td.nm small{display:block;color:var(--mute);font-size:12.5px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.nm .kb{display:inline-block;font-size:10px;font-weight:700;background:#000;color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:2px}
td.sk{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
td.ct{color:var(--ink2);font-size:13px;max-width:150px}
td.pr input{width:96px;height:34px;text-align:right;font-variant-numeric:tabular-nums}
td.pr .pc{display:block;font-size:11.5px;color:var(--red);text-align:right;min-height:14px}
td.st select{height:34px;width:132px}
td.st select.order,td.st select.out{color:var(--warn)}
.eye{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.eye.off{color:var(--red);border-color:#f3b3b6;background:#FFF1F1}
.ebtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.ebtn:hover{border-color:#999}
.empty{padding:60px;text-align:center;color:var(--mute);background:#fff;border-radius:12px;border:1px solid var(--line)}
/* панель сохранения */
#bar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);transition:transform .25s;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-width:calc(100vw - 32px)}
#bar.on{transform:translate(-50%,0)}
#bar .btn{border:0}
#bar .btn.g{background:#333;color:#fff}
/* редактор */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#ov.on{opacity:1;pointer-events:auto}
#ed,#tl{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:#fff;z-index:31;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
#tl{z-index:32}
#ed.on,#tl.on{transform:none}
.eh{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.eh h2{font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eb{flex:1;overflow:auto;padding:8px 24px 40px}
.ef{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);align-items:center}
.ef .sp{flex:1}
.ef .del{color:var(--red);font-weight:600;padding:0 6px}
fieldset{border:0;padding:18px 0;border-bottom:1px solid var(--line)}
fieldset:last-child{border-bottom:0}
legend{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:0;margin-bottom:12px;float:left;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;clear:both}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;clear:both}
.g1{display:grid;gap:12px;clear:both}
label.f,div.f{display:grid;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:600}
label.f small{font-weight:500;color:var(--mute)}
label.ck{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:22px}
label.ck input{width:18px;height:18px;accent-color:var(--red)}
.hint{font-size:12.5px;color:var(--mute);clear:both;margin-top:8px}
.f.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;clear:both}
.chip{height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink2)}
.chip:hover{border-color:#999}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on:before{content:"✓ "}
/* фото */
.phs{display:flex;flex-wrap:wrap;gap:10px;clear:both}
.phs .p{width:112px;height:112px;border:1px solid var(--line);border-radius:10px;position:relative;background:#fff;cursor:grab}
.phs .p img{width:100%;height:100%;object-fit:contain;border-radius:10px;pointer-events:none}
.phs .p:first-child{border:2px solid var(--ink)}
.phs .p:first-child:after{content:"Главное";position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.phs .p.new:before{content:"новое";position:absolute;right:6px;bottom:6px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.phs .p button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.phs .p button:hover{background:var(--red);color:#fff;border-color:var(--red)}
.phs .p.dg{opacity:.4}
.phs .add{width:112px;height:112px;border:2px dashed #ccc;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;padding:8px}
.phs .add:hover,.phs .add.drop{border-color:var(--ink);color:var(--ink)}
/* характеристики */
.sg{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;clear:both}
.sg .st{display:flex;gap:8px;margin-bottom:8px}
.sg .st input{font-weight:700}
.sr{display:grid;grid-template-columns:1.2fr 1fr 30px;gap:6px;margin-top:6px}
.sr input.t{height:32px;font-size:13px}
.x{width:30px;height:32px;border-radius:6px;color:var(--mute);font-size:18px}
.x:hover{background:#FFF1F1;color:var(--red)}
.lnk{color:var(--ink);font-weight:600;font-size:13px;margin-top:8px;padding:4px 0}
.lnk:hover{color:var(--red)}
/* уведомления */
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);transition:transform .25s;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100vw - 32px)}
#toast.on{transform:translate(-50%,0)}
#toast.er{background:var(--red)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:70;font-weight:700}
#busy.on{display:grid}
/* разделы */
.tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto;margin-top:-4px}
.tabs button{padding:9px 14px 11px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tabs button i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:6px}
.iv{display:none}body.v-items .iv,body.v-check .iv{display:contents}
.vh{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap;min-height:38px}
.vh .sum{margin:0 auto 0 2px}
#vb{display:flex;gap:8px;flex-wrap:wrap}
th.cb,td.cb{width:36px;padding-right:0}
th.cb input,td.cb input{width:17px;height:17px;accent-color:var(--red);display:block}
td.od input{width:64px;height:34px;text-align:center}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;background:var(--ink);color:#fff}
.tg.hit{background:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--ink2);white-space:nowrap;margin:2px 4px 2px 0}
.pill.on,.pill.done{background:#E7F5EC;color:var(--ok)}.pill.plan,.pill.work{background:#FFF6E5;color:var(--warn)}.pill.new,.pill.bad{background:#FFF1F1;color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 24px 8px;max-width:960px}
.pv{width:100%;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-top:4px;clear:both}
.pv td,.pv th{padding:6px 10px}
.pv td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pv s{color:var(--mute)}.pv .up{color:var(--red);font-weight:700}.pv .dn{color:var(--ok);font-weight:700}
.res{display:grid;gap:2px;margin-top:6px;max-height:260px;overflow:auto}
.res button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:8px}
.res button:hover{background:var(--soft)}
.res img{width:36px;height:36px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.res small{color:var(--mute)}
.chip.x2:after{content:" ×";color:var(--mute)}
.chip:disabled{opacity:.45;cursor:default}
.drop{border:2px dashed #ccc;border-radius:12px;padding:28px;text-align:center;color:var(--mute);font-weight:600;clear:both}
.drop.on{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;clear:both}.kv b{color:var(--mute);font-weight:600}
.warnb{background:#FFF8E6;border:1px solid #f0d9b5;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:10px;clear:both}
@media (max-width:900px){.hb .q{max-width:none;flex-basis:100%;order:5}td.ct,th.ct,td.sk,th.sk{display:none}.g2,.g3{grid-template-columns:1fr}.eh,.eb,.ef{padding-left:16px;padding-right:16px}main{padding:12px 8px 120px}}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="lf">
    <img src="assets/teka-logo-sq.svg" alt="TEKA">
    <h1>Вход в админку</h1>
    <input class="t" id="lp" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button class="btn r" type="submit">Войти</button>
    <div class="er" id="le"></div>
  </form>
</div>

<header>
  <div class="hb">
    <div class="lg"><img src="assets/teka-logo-sq.svg" alt="TEKA">Админка</div>
    <div class="iv"><input class="t q" id="q" type="search" placeholder="Поиск: модель, код, описание">
    <select class="t" id="fc"></select>
    <select class="t" id="fs">
      <option value="">Все товары</option>
      <option value="sale">Со скидкой</option>
      <option value="noprice">Без цены</option>
      <option value="order">Под заказ</option>
      <option value="out">Нет в наличии</option>
      <option value="hid">Скрытые</option>
      <option value="tag">Хит или новинка</option>
      <option value="promo">В акции</option>
      <option value="dirty">Изменённые</option>
    </select></div>
    <span class="sp"></span>
    <div class="iv"><button class="btn r" id="nw">+ Новый товар</button></div>
    <a class="btn" href="desk-catalog.html" target="_blank" rel="noopener">Сайт ↗</a>
    <button class="btn" id="lo" title="Выйти">Выйти</button>
  </div>
  <nav class="tabs" id="nav"><button data-v="items">Товары</button><button data-v="promo">Акции</button><button data-v="check">Проверка каталога</button><button data-v="site">Контакты и тексты</button><button data-v="orders">Заказы</button><button data-v="offers">Подборки</button><button data-v="clients">Клиенты</button><button data-v="hist">История</button></nav>
</header>

<main>
  <div class="vh"><div class="sum" id="sum"></div><div id="vb"></div></div>
  <div id="tw"></div>
  <div id="vw" hidden></div>
</main>

<div id="bar"><span id="bt"></span><button class="btn g" id="bu">Отменить</button><button class="btn r" id="bs">Сохранить на сайт</button></div>

<div id="ov"></div>
<aside id="ed" aria-hidden="true">
  <div class="eh"><h2 id="et"></h2><button class="btn" id="ec">Закрыть</button></div>
  <div class="eb" id="eb"></div>
  <div class="ef"><button class="del" id="edl">Удалить товар</button><span class="sp"></span><button class="btn" id="edu" title="Применить правки и создать копию товара">Дублировать</button><button class="btn" id="ex">Отмена</button><button class="btn k" id="eo">Готово</button></div>
</aside>
<aside id="tl" aria-hidden="true">
  <div class="eh"><h2 id="tlt"></h2><button class="btn" id="tlc">Закрыть</button></div>
  <div class="eb" id="tlb"></div>
  <div class="ef" id="tlf"></div>
</aside>

<div id="toast"></div>
<div id="busy">Сохраняю…</div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<input type="file" id="fi2" accept="image/*" hidden>
<input type="file" id="fi3" accept=".csv,.xlsx,.xls,text/csv" hidden>

<script>
const API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'':'https://teka-admin.teka-md.workers.dev';
const FILES=[
  {f:'ovens',n:'Духовые шкафы'},{f:'hobs',n:'Варочные панели'},{f:'hoods',n:'Вытяжки'},{f:'microwaves',n:'Микроволновые печи'},
  {f:'compact',n:'Компактная техника и кофемашины'},{f:'fridges',n:'Холодильники'},{f:'wine-coolers',n:'Винные шкафы'},
  {f:'dishwashers',n:'Посудомоечные машины'},{f:'sinks',n:'Мойки'},{f:'faucets',n:'Смесители'},
  {f:'laundry',n:'Стиральные и сушильные машины'},{f:'accessories',n:'Аксессуары'}];
const FN=Object.fromEntries(FILES.map(c=>[c.f,c.n]));
const RO1=new Set(["111020005","111020031","41560140","111010079","111010071","111010082","111000076","111000005","111010012","111010010","111000004","111010086","111000094","111000045","111000010","111000012","111000013","111000011","111000046","111000056","111000026","111200001","111000000","121010037","121020000","121010060","121010007","121210000","121200002","121000001"]);
const XL={col:'Цвет',kind:'Тип',w:'Ширина, см',width:'Ширина, см',mat:'Материал',bowls:'Количество чаш',cap:'Объём',install:'Встраивание',bottles:'Бутылок',c:'Тип духовки',f:'Функции'};
const VL={col:{negru:'Чёрный',inox:'Нержавейка',alb:'Белый',gri:'Серый',crem:'Кремовый',crom:'Хром',auriu:'Золотой',antracit:'Антрацит'},
 kind:{inductie:'Индукция',gaz:'Газ',vitroceramica:'Стеклокерамика',incorporabila:'Встраиваемая',telescopica:'Телескопическая',perete:'Настенная','perete-inclinat':'Наклонная',insula:'Островная',incorporabil:'Встраиваемый',combina:'Комби',congelator:'Морозильник','o-usa':'Однодверный','french-door':'French door','side-by-side':'Side-by-side',standard:'Стандарт',extractibil:'Выдвижной душ',dozator:'Дозатор',osmoza:'Осмос',spalat:'Стирка','spalat-uscat':'Стирка + сушка',uscator:'Сушилка',independent:'Отдельностоящий',espresso:'Кофемашина','cuptor-compact':'Компактная духовка','sertar-termic':'Подогреватель посуды','aparat-de-vidat':'Вакууматор','cuptor-abur':'Паровая духовка'},
 install:{incorporabil:'Встраиваемый',independent:'Отдельностоящий'},c:{multi:'Мультифункциональный',micro:'С СВЧ'},
 f:{piro:'Пиролиз',aburi:'Пар',micro:'СВЧ',airfry:'AirFry',pizza:'Пицца 300°'},mat:{granit:'Тегранит',inox:'Нержавейка'},bowls:{1:'1 чаша',2:'2 чаши'}};
const TXTK=new Set(['cap','bottles']),NUMK=new Set(['w','width','bowls','bottles']);
const BASE=new Set(['sku','n','name','sub','p','price','o','old','t','d','b','brand','img','draw','label','desc','specs','pdf','u','st','hid','src','tag','ord']);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOK='';try{TOK=localStorage.getItem('tkAdm')||''}catch(e){}
let RAW='',DB={},RU=null,PHO={},GL={lo:{}},ROWS=[],DIRTY=new Set(),CHG=new Set(),UP={},PM={data:{promos:[]}},SC={data:{}},SEL=new Set();

function toast(m,er){const t=$('toast');t.textContent=m;t.className='on'+(er?' er':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className=er?'er':'',er?6000:3500)}
async function api(p,body){
  const r=await fetch(API+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'Сервер не отвечает'}));
  if(r.status===401&&p!=='/api/login'){showLogin();throw new Error(j.error)}
  if(!r.ok){const e=new Error(j.error||('Ошибка '+r.status));e.status=r.status;e.j=j;throw e}
  return j}

/* ключи разных схем товара */
const K={n:x=>'name' in x&&!('n' in x)?'name':'n',p:x=>'price' in x&&!('p' in x)?'price':'p',o:x=>'old' in x&&!('o' in x)?'old':('price' in x&&!('p' in x)?'old':'o'),b:x=>'brand' in x&&!('b' in x)?'brand':'b'};
const nm=x=>x[K.n(x)]||'',pr=x=>+(x[K.p(x)]||0),od=x=>+(x[K.o(x)]||0),bnd=x=>x[K.b(x)]||'Teka';
function setPrice(x,p,o){
  x[K.p(x)]=p;const ok=K.o(x);
  if(o>p&&p){x[ok]=o;if('t' in x||ok==='o'){x.t='sale';x.d=Math.round((1-p/o)*100)}}
  else{if(ok==='old'&&'old' in x)x.old=0;else delete x[ok];if(x.t==='sale'){delete x.t;delete x.d}}}
function pics(x){
  if(x.u&&x.u.length)return x.u.slice();const k=String(x.sku);
  if(PHO[k]&&PHO[k].length)return PHO[k].map(i=>'assets/hi/'+i+'-m.webp');
  return (GL.lo[k]||x.img||[]).map(f=>(RO1.has(k)&&!GL.lo[k]?'assets/ro/':'assets/ro2/')+f)}
const thumb=u=>u.replace(/^assets\/(hi|ro2?)\//,'assets/c/$1-');
function imgSrc(u){return UP[u]?UP[u].url:u}
const IMGERR="if(!this.dataset.e){this.dataset.e=1;this.src=this.dataset.o}else if(this.dataset.e==1&&this.dataset.r){this.dataset.e=2;this.src=this.dataset.r}";
const img=(u,cls='')=>{if(!u)return `<img class="${cls}" alt="">`;const s=imgSrc(u);return `<img class="${cls}" src="${esc(UP[u]?s:thumb(s))}" data-o="${esc(s)}" ${RAW?`data-r="${esc(RAW+u)}"`:''} alt="" loading="lazy" onerror="${IMGERR}">`};

/* вход */
function showLogin(){$('login').hidden=false;setTimeout(()=>$('lp').focus(),50)}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';
  try{const j=await api('/api/login',{pass:$('lp').value});TOK=j.token;try{localStorage.setItem('tkAdm',TOK)}catch(e){}$('lp').value='';$('login').hidden=true;load()}
  catch(er){$('le').textContent=er.message}};
$('lo').onclick=()=>{if(dirtyCount()&&!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;TOK='';try{localStorage.removeItem('tkAdm')}catch(e){}location.reload()};

/* загрузка */
async function load(){
  $('tw').innerHTML='<div class="empty">Загружаю товары…</div>';
  try{
    const cfg=await api('/api/config');RAW=cfg.raw||'';
    const opt=p=>api('/api/file?path='+p).catch(e=>{if(e.status===401)throw e;return {sha:null,text:null}});
    const [ru,pm,sc,...fs]=await Promise.all([api('/api/file?path=data/ru.json'),opt('data/promo.json'),opt('data/site.json'),...FILES.map(c=>api('/api/file?path=data/'+c.f+'.json'))]);
    RU={sha:ru.sha,data:JSON.parse(ru.text)};
    const pj=t=>{try{return t?JSON.parse(t):null}catch(e){return null}};
    PM={sha:pm.sha,data:pj(pm.text)||{promos:[]},dirty:false};if(!Array.isArray(PM.data.promos))PM.data.promos=[];
    SC={sha:sc.sha,data:pj(sc.text)||{},dirty:false};
    FILES.forEach((c,i)=>DB[c.f]={sha:fs[i].sha,items:JSON.parse(fs[i].text)});
    const rd=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
    [PHO,GL]=await Promise.all([rd('data/photos.json').then(j=>j||{}),rd('data/gallery.json').then(j=>j||{lo:{}})]);
    DIRTY.clear();CHG.clear();UP={};SEL.clear();
    $('fc').innerHTML='<option value="">Все категории</option>'+FILES.map(c=>`<option value="${c.f}">${c.n} (${DB[c.f].items.length})</option>`).join('');dd($('fc'));
    render();bar();loadOrders(true)}
  catch(e){if(e.status!==401)$('tw').innerHTML=`<div class="empty">Не удалось загрузить: ${esc(e.message)}</div>`}}

/* свои выпадающие списки вместо системных */
function dd(sel){
  let w=sel._dd;
  if(!w){w=document.createElement('div');w.className='dd';sel.after(w);sel.hidden=true;sel._dd=w;
    w.addEventListener('click',e=>{const li=e.target.closest('li');
      if(li){sel.value=li.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}));w.classList.remove('on');dd(sel);return}
      if(e.target.closest('button')){const o=w.classList.contains('on');ddClose();if(!o){w.classList.add('on');ddPlace(w)}}})}
  const sp=t=>{const m=t.match(/^(.*?)\s*\((\d+)\)$/);return m?[m[1],m[2]]:[t,'']};
  w.className='dd '+(sel.value||'');const cur=sel.options[sel.selectedIndex];
  w.innerHTML=`<button type="button">${esc(sp(cur?cur.text:'')[0])}</button><ul>${[...sel.options].map(o=>{const [t,n]=sp(o.text);return `<li data-v="${esc(o.value)}" class="${o.value===sel.value?'sel':''}"><span>${esc(t)}</span>${n?`<small>${n}</small>`:''}</li>`}).join('')}</ul>`}
const ddClose=()=>document.querySelectorAll('.dd.on').forEach(x=>x.classList.remove('on'));
function ddPlace(w){const b=w.querySelector('button').getBoundingClientRect(),u=w.querySelector('ul');u.style.minWidth=b.width+'px';u.style.left=Math.min(b.left,innerWidth-u.offsetWidth-8)+'px';
  const h=u.offsetHeight;u.style.top=(b.bottom+6+h>innerHeight&&b.top-6-h>0?b.top-6-h:b.bottom+6)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))ddClose()});
addEventListener('keydown',e=>{if(e.key==='Escape')ddClose()});
addEventListener('scroll',e=>{if(!(e.target.closest&&e.target.closest('.dd ul')))ddClose()},true);addEventListener('resize',ddClose);
dd($('fs'));

/* список */
function rows(){const q=$('q').value.trim().toLowerCase(),fc=$('fc').value,fs=$('fs').value;const R=[];
  for(const c of FILES){if(fc&&fc!==c.f)continue;
    for(const x of DB[c.f].items){
      if(q&&!(nm(x)+' '+x.sku+' '+(x.sub||'')+' '+bnd(x)).toLowerCase().includes(q))continue;
      if(fs==='sale'&&!(od(x)>pr(x)&&pr(x)))continue;if(fs==='noprice'&&pr(x))continue;
      if((fs==='order'||fs==='out')&&x.st!==fs)continue;if(fs==='hid'&&!x.hid)continue;if(fs==='dirty'&&!DIRTY.has(x))continue;
      if(fs==='tag'&&!x.tag)continue;if(fs==='promo'&&!promoOf(x,c.f))continue;
      R.push({f:c.f,x})}}
  if(fc)R.sort((a,b)=>ow(a.x)-ow(b.x));
  return R}
const ow=x=>x.ord!==''&&x.ord!=null&&!isNaN(x.ord)?+x.ord:1e6;
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE0='<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10 10 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function pct(x){const p=pr(x),o=od(x);return o>p&&p?'−'+Math.round((1-p/o)*100)+'%':''}
function selUI(){$('sum').textContent=`Показано ${ROWS.length} из ${FILES.reduce((s,c)=>s+DB[c.f].items.length,0)} товаров`+(SEL.size?` · отмечено ${SEL.size}`:'');
  $('vb').innerHTML=`${SEL.size?'<button class="btn" id="b_un">Снять отметки</button>':''}<button class="btn" id="b_bulk">Цены пачкой</button><button class="btn" id="b_imp">Импорт прайса</button>`}
function draw(){ROWS=rows();const fc=$('fc').value;selUI();
  if(!ROWS.length){$('tw').innerHTML='<div class="empty">Ничего не найдено</div>';return}
  $('tw').innerHTML=`<table><thead><tr><th class="cb"><input type="checkbox" id="ca" title="Отметить все показанные" ${ROWS.every(r=>SEL.has(r.x))?'checked':''}></th><th></th><th>Товар</th><th class="sk">Код</th><th class="ct">Категория</th><th>Цена, MDL</th><th>Старая цена</th><th>Наличие</th>${fc?'<th title="Порядок в категории: меньше — выше">Порядок</th>':''}<th title="Показывать на сайте">Сайт</th><th></th></tr></thead><tbody>${ROWS.map(({f,x},i)=>`
  <tr data-i="${i}" class="${DIRTY.has(x)?'dz':''} ${x.hid?'hd':''}">
   <td class="cb"><input type="checkbox" data-k="sel" ${SEL.has(x)?'checked':''}></td>
   <td class="ph">${img(pics(x)[0])}</td>
   <td class="nm"><b>${esc(nm(x))||'<i>без названия</i>'}${bnd(x)!=='Teka'?'<span class="kb">KB</span>':''}${tagH(x)}${promoOf(x,f)?'<span class="tg hit" title="Участвует в акции">%</span>':''}</b><small>${esc(x.sub)}</small></td>
   <td class="sk">${esc(x.sku)}</td><td class="ct">${esc(FN[f])}</td>
   <td class="pr"><input class="t" data-k="p" value="${pr(x)||''}" inputmode="numeric"><span class="pc"></span></td>
   <td class="pr"><input class="t" data-k="o" value="${od(x)>pr(x)?od(x):''}" inputmode="numeric" placeholder="—"><span class="pc">${pct(x)}</span></td>
   <td class="st"><select class="t ${x.st||''}" data-k="st"><option value="">В наличии</option><option value="order" ${x.st==='order'?'selected':''}>Под заказ</option><option value="out" ${x.st==='out'?'selected':''}>Нет в наличии</option></select></td>
   ${fc?`<td class="od"><input class="t" data-k="ord" value="${x.ord??''}" inputmode="numeric" placeholder="—"></td>`:''}
   <td><button class="eye ${x.hid?'off':''}" data-k="hid" title="${x.hid?'Скрыт с сайта — показать':'Виден на сайте — скрыть'}">${x.hid?EYE0:EYE}</button></td>
   <td><button class="ebtn" data-k="ed">Изменить</button></td></tr>`).join('')}</tbody></table>`;
  $('tw').querySelectorAll('td.st select').forEach(dd)}
const num=v=>{const n=parseInt(String(v).replace(/[^\d]/g,''),10);return isNaN(n)?0:n};
function touch(x,f){DIRTY.add(x);CHG.add(f);bar()}
$('tw').addEventListener('change',e=>{const el=e.target;
  if(el.id==='ca'){ROWS.forEach(r=>el.checked?SEL.add(r.x):SEL.delete(r.x));draw();return}
  const tr=el.closest('tr');if(!tr||tr.dataset.i==null)return;const {f,x}=ROWS[+tr.dataset.i];
  if(el.dataset.k==='sel'){el.checked?SEL.add(x):SEL.delete(x);const a=$('ca');if(a)a.checked=ROWS.every(r=>SEL.has(r.x));
    selUI();return}
  if(el.dataset.k==='ord'){const v=el.value.trim();if(v!==''&&!isNaN(+v))x.ord=+v;else{delete x.ord;el.value=''}}
  if(el.dataset.k==='p'||el.dataset.k==='o'){const ins=tr.querySelectorAll('td.pr input');const p=num(ins[0].value),o=num(ins[1].value);
    setPrice(x,p,o);ins[0].value=p||'';ins[1].value=od(x)>pr(x)?od(x):'';tr.querySelectorAll('td.pr .pc')[1].textContent=pct(x)}
  if(el.dataset.k==='st'){if(el.value)x.st=el.value;else delete x.st;el.className='t '+(x.st||'');dd(el)}
  touch(x,f);tr.classList.add('dz')});
$('tw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const tr=b.closest('tr');const {f,x}=ROWS[+tr.dataset.i];
  if(b.dataset.k==='hid'){if(x.hid)delete x.hid;else x.hid=true;touch(x,f);render()}
  if(b.dataset.k==='ed')openEd(f,x)});
$('tw').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){e.target.blur()}});
let qt;$('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(render,150)};$('fc').onchange=render;$('fs').onchange=render;
$('vb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='b_un'){SEL.clear();draw()}if(b.id==='b_bulk')openBulk();if(b.id==='b_imp')openImp()});

/* сохранение */
const dirtyCount=()=>DIRTY.size+[...CHG].filter(f=>f.startsWith('-')).length+(PM.dirty?1:0)+(SC.dirty?1:0);
function bar(){const n=DIRTY.size,d=[...CHG].filter(f=>f.startsWith('-')).length,ex=[PM.dirty?'акции':'',SC.dirty?'контакты':''].filter(Boolean);
  $('bt').textContent=[n?`Изменено товаров: ${n}`:'',d?`удалено: ${d}`:'',ex.length?'изменены '+ex.join(' и '):''].filter(Boolean).join(' · ');$('bar').classList.toggle('on',CHG.size>0)}
const dump=d=>JSON.stringify(d,null,1);
$('bu').onclick=()=>{if(confirm('Отменить все несохранённые изменения?'))load()};
$('bs').onclick=save;
async function save(){
  const fs=[...new Set([...CHG].map(f=>f.replace(/^-/,'')))].filter(f=>DB[f]);
  const files=fs.map(f=>({path:`data/${f}.json`,text:dump(DB[f].items),base:DB[f].sha}));
  if(RU.dirty)files.push({path:'data/ru.json',text:JSON.stringify(RU.data,null,1).replace(/^ +/gm,''),base:RU.sha});
  if(PM.dirty)files.push({path:'data/promo.json',text:dump(PM.data),base:PM.sha});
  if(SC.dirty)files.push({path:'data/site.json',text:dump(SC.data),base:SC.sha});
  const used=new Set(fs.flatMap(f=>DB[f].items.flatMap(x=>x.u||[])).concat(PM.dirty?PM.data.promos.map(p=>p.img).filter(Boolean):[]));
  for(const [p,u] of Object.entries(UP))if(used.has(p))files.push({path:p,b64:u.b64});
  if(!files.length){CHG.clear();bar();return}
  const names=[...DIRTY].map(nm).filter(Boolean);
  const ex=[PM.dirty?'акции':'',SC.dirty?'контакты':''].filter(Boolean);
  const msg='Админка: '+[names.length?names.slice(0,6).join(', ')+(names.length>6?` и ещё ${names.length-6}`:''):'',ex.join(', ')].filter(Boolean).join('; ')||'Админка: изменения в каталоге';
  $('busy').classList.add('on');
  try{const r=await api('/api/commit',{message:msg,files});
    fs.forEach(f=>DB[f].sha=r.shas[`data/${f}.json`]);if(RU.dirty){RU.sha=r.shas['data/ru.json'];RU.dirty=false}
    if(PM.dirty){PM.sha=r.shas['data/promo.json'];PM.dirty=false}if(SC.dirty){SC.sha=r.shas['data/site.json'];SC.dirty=false}HIST=null;
    for(const p of Object.keys(UP))if(used.has(p))UP[p].saved=true;
    DIRTY.clear();CHG.clear();bar();render();toast('Сохранено. Сайт обновится примерно через 1–2 минуты.')}
  catch(e){toast(e.status===409?'Кто-то изменил каталог в другом окне. Обновите страницу (ваши правки не сохранены).':'Не сохранилось: '+e.message,true)}
  finally{$('busy').classList.remove('on')}}
addEventListener('beforeunload',e=>{if(CHG.size){e.preventDefault();e.returnValue=''}});

/* редактор */

/* поле фильтра: варианты берём из товаров этой категории */
function filt(k,v,f){
  const L=XL[k]||k,vl=VL[k]||{},seen=new Set();
  DB[f].items.forEach(y=>{const z=y[k];(Array.isArray(z)?z:[z]).forEach(e=>{if(e!==''&&e!=null)seen.add(String(e))})});
  Object.keys(vl).forEach(e=>{if(Array.isArray(v)||seen.size)seen.add(e)});
  const vals=[...seen].sort((a,b)=>isNaN(a)||isNaN(b)?(vl[a]||a).localeCompare(vl[b]||b):a-b);
  const nm=e=>vl[e]?vl[e]:e;
  if(Array.isArray(v))return `<div class="f wide"><span>${esc(L)}</span><div class="chips" data-xa="${esc(k)}">${vals.map(e=>`<button type="button" class="chip ${v.map(String).includes(e)?'on':''}" data-v="${esc(e)}">${esc(nm(e))}</button>`).join('')}</div></div>`;
  if(TXTK.has(k))return `<label class="f">${esc(L)}<input class="t" data-x="${esc(k)}" value="${esc(v)}"></label>`;
  const cur=String(v??'');if(cur&&!vals.includes(cur))vals.push(cur);
  return `<label class="f">${esc(L)}<select class="t" data-x="${esc(k)}" data-cur="${esc(cur)}"><option value="">—</option>${vals.map(e=>`<option value="${esc(e)}" ${e===cur?'selected':''}>${esc(nm(e))}${NUMK.has(k)&&!vl[e]&&(k==='w'||k==='width')?' см':''}</option>`).join('')}<option value="__new">+ Другое значение…</option></select></label>`}

async function upImg(file,base){const bm=await createImageBitmap(file);const M=1600,s=Math.min(1,M/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.86),ext='webp';if(!url.startsWith('data:image/webp')){url=c.toDataURL('image/jpeg',.88);ext='jpg'}
  const path=`assets/u/${slug(base)}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.${ext}`;

function drawOrders(){$('sum').textContent=ORD?`Заказов: ${ORD.length}`:'';
  $('vb').innerHTML='<button class="btn" id="oref">Обновить</button>';$('oref').onclick=()=>{$('vw').innerHTML='<div class="empty">Загружаю…</div>';loadOrders()};
  if(!ORD){$('vw').innerHTML='<div class="empty">Загружаю…</div>';return}
  if(ORD.err){$('vw').innerHTML=`<div class="empty">Журнал заказов недоступен: ${esc(ORD.err)}</div>`;return}
  const MG=[...new Set(ORD.map(o=>o.mg).filter(Boolean))].sort();
  const L=ORD.filter(o=>(!OST||o.st===OST)&&(!OMG||(OMG==='-'?!o.mg:o.mg===OMG)));
  $('vb').insertAdjacentHTML('afterbegin',`<select class="t" id="omg"><option value="">Все менеджеры</option>${MG.map(m=>`<option value="${esc(m)}" ${OMG===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="-" ${OMG==='-'?'selected':''}>Сайт (без менеджера)</option></select>`);dd($('omg'));$('omg').onchange=e=>{OMG=e.target.value;drawOrders()};
  $('vw').innerHTML=`<div class="chips" id="osc" style="margin-bottom:12px"><button class="chip ${OST?'':'on'}" data-v="">Все (${ORD.length})</button>${Object.entries(OS).map(([k,l])=>`<button class="chip ${OST===k?'on':''}" data-v="${k}">${l} (${ORD.filter(o=>o.st===k).length})</button>`).join('')}</div>`+
   (L.length?`<table><thead><tr><th>Когда</th><th>Заказ</th><th>Сумма</th><th>Канал</th><th>Менеджер</th><th>Статус</th><th></th></tr></thead><tbody>${L.map(o=>`<tr data-id="${esc(o.id)}"><td class="sk">${dt(o.t)}</td><td class="nm"><b>${esc(o.nm||'')}</b><small>${o.n>1?`всего ${o.n} шт.`:'1 шт.'}${o.cl?' · '+esc(o.cl):''}${o.of?' · подборка №'+esc(o.of):''}</small></td><td class="sk"><b>${(o.tot||0).toLocaleString('ru-RU')} MDL</b></td><td class="ct">${CHN(o.ch)}</td><td class="ct">${esc(o.mg||'—')}</td>
    <td class="st"><select class="t ${o.st==='new'?'order':''}" data-k="st">${Object.entries(OS).map(([k,l])=>`<option value="${k}" ${o.st===k?'selected':''}>${l}</option>`).join('')}</select></td><td><button class="ebtn" data-k="op">Открыть</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Заказов нет. Копии заказов из корзины сайта (WhatsApp/Viber) появляются здесь автоматически.</div>');
  $('osc').onclick=e=>{const b=e.target.closest('.chip');if(b){OST=b.dataset.v;drawOrders()}};
  $('vw').querySelectorAll('td.st select').forEach(dd);
  $('vw').querySelectorAll('tr[data-id]').forEach(tr=>{tr.querySelector('select').onchange=e=>setOst(tr.dataset.id,e.target.value);tr.querySelector('[data-k=op]').onclick=()=>openOrder(tr.dataset.id)})}
async function setOst(id,st){try{await api('/api/order-status',{id,st});const o=ORD.find(z=>z.id===id);if(o)o.st=st;toast('Статус: '+OS[st]);loadOrders()}catch(e){toast('Не удалось изменить статус: '+e.message,true)}}
async function openOrder(id){let o;try{o=await api('/api/order?id='+encodeURIComponent(id))}catch(e){return toast(e.message,true)}
  tlOpen('Заказ от '+dt(o.t),`<fieldset><legend>Товары</legend><table class="pv"><thead><tr><th>Товар</th><th>Код</th><th style="text-align:right">Кол-во</th><th style="text-align:right">Цена</th><th style="text-align:right">Сумма</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.n)}</td><td class="sk">${esc(i.sku)}</td><td class="n">${i.q}</td><td class="n">${i.o>i.p?`<s>${i.o}</s> `:''}${i.p||'по запросу'}</td><td class="n"><b>${i.p*i.q}</b></td></tr>`).join('')}<tr><td colspan="4"><b>Итого, MDL</b></td><td class="n"><b>${o.tot}</b></td></tr></tbody></table></fieldset>
   <fieldset><legend>Детали</legend><div class="kv"><b>Статус</b><span>${Object.entries(OS).map(([k,l])=>`<button type="button" class="chip ${o.st===k?'on':''}" data-st="${k}" style="margin:0 6px 6px 0">${l}</button>`).join('')}</span>
    <b>Канал</b><span>${CHN(o.ch)}</span><b>Получение</b><span>${o.m==='p'?'Самовывоз':o.m==='d'?'Доставка':'—'}</span>
    ${o.name?`<b>Имя</b><span>${esc(o.name)}</span>`:''}${o.tel?`<b>Телефон</b><span><a href="tel:${esc(o.tel)}">${esc(o.tel)}</a></span>`:''}
    ${o.mg?`<b>Менеджер</b><span>${esc(o.mg)}</span>`:''}${o.of?`<b>Подборка</b><span><a href="desk-offer.html?o=${esc(o.of)}&nv=1" target="_blank" rel="noopener">№${esc(o.of)} ↗</a></span>`:''}
    <b>Комментарий</b><span>${esc(o.cm||'—')}</span><b>Язык сайта</b><span>${esc(o.lang||'—')}</span><b>Страница</b><span style="word-break:break-all">${esc(o.page||'—')}</span></div>
    <div class="hint">${o.ch==='mgr'?'Заказ оформлен менеджером в режиме менеджера.':'Это копия заказа, которую сайт отправляет параллельно с сообщением в мессенджер. Клиент мог не отправить само сообщение — сверяйтесь с WhatsApp/Viber.'}</div></fieldset>`,
   '<span class="sp"></span><button class="btn k" data-a="x">Закрыть</button>',{click:async e=>{const b=e.target.closest('[data-st]');if(!b)return;await setOst(id,b.dataset.st);$('tlb').querySelectorAll('[data-st]').forEach(c=>c.classList.toggle('on',c===b))}})}

/* подборки менеджеров */
let OFS=null,OFF='',OFM='';
async function drawOffers(){$('sum').textContent=OFS?`Подборок: ${OFS.length}`:'';
  $('vb').innerHTML='<button class="btn" id="ofr">Обновить</button>';$('ofr').onclick=()=>{OFS=null;drawOffers()};
  if(!OFS){$('vw').innerHTML='<div class="empty">Загружаю…</div>';try{OFS=(await api('/api/offers')).offers.sort((a,b)=>b.t-a.t)}catch(e){if(e.status!==401)$('vw').innerHTML=`<div class="empty">Не удалось загрузить: ${esc(e.message)}</div>`;return}if(VIEW!=='offers')return;$('sum').textContent=`Подборок: ${OFS.length}`}
  const MG=[...new Set(OFS.map(o=>o.mg).filter(Boolean))].sort();
  $('vb').insertAdjacentHTML('afterbegin',`<select class="t" id="ofm"><option value="">Все менеджеры</option>${MG.map(m=>`<option value="${esc(m)}" ${OFM===m?'selected':''}>${esc(m)}</option>`).join('')}</select>`);dd($('ofm'));$('ofm').onchange=e=>{OFM=e.target.value;drawOffers()};
  const F={'':['Все',()=>1],no:['Не открыты',o=>!o.op],op:['Открыты',o=>o.op&&!o.or],or:['Стали заказом',o=>o.or]};
  const B=OFS.filter(o=>!OFM||o.mg===OFM),L=B.filter(F[OFF][1]);
  $('vw').innerHTML=`<div class="chips" id="ofc" style="margin-bottom:12px">${Object.entries(F).map(([k,[l,f]])=>`<button class="chip ${OFF===k?'on':''}" data-v="${k}">${l} (${B.filter(f).length})</button>`).join('')}</div>`+
   (L.length?`<table><thead><tr><th>Когда</th><th>Подборка</th><th>Менеджер</th><th>Клиент</th><th>Сумма</th><th>Клиент открыл</th><th>Заказ</th></tr></thead><tbody>${L.map(o=>`<tr><td class="sk">${dt(o.t)}</td><td class="nm"><b><a href="desk-offer.html?o=${esc(o.id)}&nv=1" target="_blank" rel="noopener">№${esc(o.id)} ↗</a></b><small>${o.n} шт.</small></td><td class="ct">${esc(o.mg||'—')}</td>
    <td class="nm"><b>${esc(o.nm||'—')}</b><small>${esc(o.tel||'')}</small></td><td class="sk"><b>${(o.tot||0).toLocaleString('ru-RU')} MDL</b></td><td>${o.op?`<span class="pill on">${dt(o.op)}</span>`:'<span class="pill">не открыта</span>'}</td><td>${o.or?'<span class="pill done">да</span>':'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Подборок нет. Менеджеры создают их на сайте в режиме менеджера (desk-catalog.html#manager).</div>');
  $('ofc').onclick=e=>{const b=e.target.closest('.chip');if(b){OFF=b.dataset.v;drawOffers()}}}

/* клиенты */
let CLS=null,CLQ='',CLM='',CLT='',CLO='last';
const TAGS0=['дизайнер','застройщик','повторный','VIP'];
const ddate=t=>t?new Date(t).toLocaleDateString('ru-RU'):'—';
async function drawClients(){
  if(!CLS){$('vw').innerHTML='<div class="empty">Загружаю…</div>';try{CLS=(await api('/api/clients')).clients}catch(e){if(e.status!==401)$('vw').innerHTML=`<div class="empty">Не удалось загрузить: ${esc(e.message)}</div>`;return}if(VIEW!=='clients')return}
  const MG=[...new Set(CLS.map(c=>c.mg).filter(Boolean))].sort(),TG=[...new Set(CLS.flatMap(c=>c.tg||[]))].sort();
  const q=CLQ.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const L=CLS.filter(c=>(!q||(c.n||'').toLowerCase().includes(q)||qd.length>2&&c.tel.replace(/\D/g,'').includes(qd))&&(!CLM||c.mg===CLM)&&(!CLT||(c.tg||[]).includes(CLT)))
    .sort(CLO==='tot'?(a,b)=>(b.tot||0)-(a.tot||0):CLO==='nm'?(a,b)=>(a.n||'').localeCompare(b.n||''):(a,b)=>(b.last||0)-(a.last||0));
  $('sum').textContent=`Клиентов: ${L.length}${L.length!==CLS.length?' из '+CLS.length:''}`;
  $('vb').innerHTML=`<input class="t" id="clq" type="search" placeholder="Имя или телефон" value="${esc(CLQ)}" style="width:220px">
   <select class="t" id="clm"><option value="">Все менеджеры</option>${MG.map(m=>`<option ${CLM===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
   <select class="t" id="clt"><option value="">Все теги</option>${TG.map(m=>`<option ${CLT===m?'selected':''}>${esc(m)}</option>`).join('')}</select>
   <select class="t" id="clo"><option value="last" ${CLO==='last'?'selected':''}>Сначала недавние</option><option value="tot" ${CLO==='tot'?'selected':''}>По сумме заказов</option><option value="nm" ${CLO==='nm'?'selected':''}>По имени</option></select>
   <button class="btn" id="clx">Экспорт CSV</button><button class="btn" id="clr">Обновить</button>`;
  ['clm','clt','clo'].forEach(i=>{dd($(i));$(i).onchange=e=>{({clm:v=>CLM=v,clt:v=>CLT=v,clo:v=>CLO=v})[i](e.target.value);drawClients()}});
  let qt2;$('clq').oninput=e=>{clearTimeout(qt2);qt2=setTimeout(()=>{CLQ=e.target.value;drawClients();const i=$('clq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('clr').onclick=()=>{CLS=null;drawClients()};$('clx').onclick=()=>csvOut(L);
  $('vw').innerHTML=L.length?`<table><thead><tr><th>Клиент</th><th>Город</th><th>Менеджер</th><th>Теги</th><th>Заказы</th><th>Подборки</th><th>Сумма заказов</th><th>Последний контакт</th><th></th></tr></thead><tbody>${L.map(c=>`<tr data-t="${esc(c.tel)}"><td class="nm"><b>${esc(c.n||'без имени')}</b><small>${esc(c.tel)}</small></td><td class="ct">${esc(c.c||'—')}</td><td class="ct">${esc(c.mg||'—')}</td>
    <td>${(c.tg||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')||'—'}</td><td class="sk">${c.no||0}</td><td class="sk">${c.nf||0}</td><td class="sk"><b>${(c.tot||0).toLocaleString('ru-RU')} MDL</b></td><td class="sk">${ddate(c.last)}</td><td><button class="ebtn">Открыть</button></td></tr>`).join('')}</tbody></table>
    <div class="hint" style="margin-top:12px">Клиенты появляются автоматически из заказов и подборок, где указан телефон. Сумма — по заказам без отменённых.</div>`:'<div class="empty">Клиентов пока нет. Они появятся из заказов и подборок менеджеров с телефоном.</div>';
  $('vw').querySelectorAll('tr[data-t] .ebtn').forEach(b=>b.onclick=()=>openClient(b.closest('tr').dataset.t))}
function csvOut(L){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const t='﻿'+[['Имя','Телефон','Город','Менеджер','Теги','Заказов','Подборок','Сумма заказов, MDL','Последний контакт'].map(c).join(';')].concat(L.map(k=>[k.n,k.tel,k.c,k.mg,(k.tg||[]).join(', '),k.no||0,k.nf||0,k.tot||0,ddate(k.last)].map(c).join(';'))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='teka-clients-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function openClient(tel){let c;try{c=await api('/api/client?tel='+encodeURIComponent(tel))}catch(e){return toast(e.message,true)}
  const MG=[...new Set((CLS||[]).map(k=>k.mg).concat(ORD?ORD.map(o=>o.mg):[]).filter(Boolean))].sort();
  const tags=[...new Set(TAGS0.concat(c.tags||[]))];
  tlOpen((c.name||'Клиент')+' · '+c.tel,`
  <fieldset><legend>Карточка</legend><div class="g3">
   <label class="f">Имя<input class="t" id="c_n" value="${esc(c.name)}"></label>
   <label class="f">Город<input class="t" id="c_c" value="${esc(c.city)}"></label>
   <label class="f">Кто ведёт<input class="t" id="c_m" value="${esc(c.mg)}" list="c_ml" placeholder="Менеджер"><datalist id="c_ml">${MG.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label></div>
   <div class="g1" style="margin-top:12px"><label class="f">Адрес<input class="t" id="c_a" value="${esc(c.addr)}"></label>
   <label class="f">Заметки<textarea class="t" id="c_no" rows="4">${esc(c.notes)}</textarea></label>
   <div class="f">Теги<div class="chips" id="c_tg">${tags.map(t=>`<button type="button" class="chip ${(c.tags||[]).includes(t)?'on':''}" data-v="${esc(t)}">${esc(t)}</button>`).join('')}<input class="t" id="c_nt" placeholder="+ свой тег" style="width:140px;height:34px"></div></div></div>
   <div class="kv" style="margin-top:14px"><b>Сумма заказов</b><span><b>${(c.tot||0).toLocaleString('ru-RU')} MDL</b> (без отменённых)</span><b>Первый контакт</b><span>${ddate(c.first)}</span><b>Последний контакт</b><span>${ddate(c.last)}</span></div></fieldset>
  <fieldset><legend>Заказы (${c.orders.length})</legend>${c.orders.length?`<table class="pv"><thead><tr><th>Дата</th><th>Статус</th><th>Менеджер</th><th>Подборка</th><th style="text-align:right">Сумма</th></tr></thead><tbody>${c.orders.map(o=>`<tr><td>${dt(o.t)}</td><td><span class="pill ${o.st}">${OS[o.st]||esc(o.st)}</span></td><td>${esc(o.mg||'—')}</td><td>${o.of?`№${esc(o.of)}`:'—'}</td><td class="n"><b>${(o.tot||0).toLocaleString('ru-RU')}</b></td></tr>`).join('')}</tbody></table>`:'<div class="hint">Заказов нет</div>'}</fieldset>
  <fieldset><legend>Подборки (${c.offers.length})</legend>${c.offers.length?`<table class="pv"><thead><tr><th>Дата</th><th>Подборка</th><th>Менеджер</th><th style="text-align:right">Сумма</th></tr></thead><tbody>${c.offers.map(o=>`<tr><td>${dt(o.t)}</td><td><a href="desk-offer.html?o=${esc(o.id)}&nv=1" target="_blank" rel="noopener">№${esc(o.id)} ↗</a></td><td>${esc(o.mg||'—')}</td><td class="n"><b>${(o.tot||0).toLocaleString('ru-RU')}</b></td></tr>`).join('')}</tbody></table>`:'<div class="hint">Подборок нет</div>'}</fieldset>`,
  FT('Сохранить'),{click:e=>{const b=e.target.closest('#c_tg .chip');if(b)b.classList.toggle('on')},
   act:{ok:async()=>{const nt=$('c_nt').value.trim();const tg=[...$('c_tg').querySelectorAll('.chip.on')].map(b=>b.dataset.v).concat(nt?[nt]:[]);
     try{const r=await api('/api/client',{tel:c.tel,name:$('c_n').value.trim(),city:$('c_c').value.trim(),addr:$('c_a').value.trim(),mg:$('c_m').value.trim(),notes:$('c_no').value,tags:tg});
       const k=(CLS||[]).find(x=>x.tel===c.tel);if(k)Object.assign(k,{n:r.name,c:r.city,mg:r.mg,tg:r.tags});tlClose();drawClients();toast('Клиент сохранён')}catch(e){toast('Не сохранилось: '+e.message,true)}}}});
  $('c_nt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){e.target.insertAdjacentHTML('beforebegin',`<button type="button" class="chip on" data-v="${esc(v)}">${esc(v)}</button>`);e.target.value=''}}}}

/* история */
let HIST=null;
const fname=p=>{const m=p.match(/^data\/(.+)\.json$/);return m?(FN[m[1]]||{ru:'Переводы RU',promo:'Акции',site:'Контакты и тексты'}[m[1]]||m[1]):'фото'};
async function drawHist(){$('sum').textContent='Последние сохранения каталога';
  $('vb').innerHTML='<button class="btn" id="href">Обновить</button>';$('href').onclick=()=>{HIST=null;drawHist()};
  if(!HIST){$('vw').innerHTML='<div class="empty">Загружаю историю…</div>';try{HIST=await api('/api/history')}catch(e){if(e.status!==401)$('vw').innerHTML=`<div class="empty">Не удалось загрузить историю: ${esc(e.message)}</div>`;return}if(VIEW!=='hist')return}
  if(!HIST.length){$('vw').innerHTML='<div class="empty">Сохранений пока нет</div>';return}
  $('vw').innerHTML=`<table><thead><tr><th>Когда</th><th>Что сохранили</th><th>Файлы</th><th></th></tr></thead><tbody>${HIST.map((c,i)=>{const g={};c.files.forEach(f=>{const n=fname(f.path);g[n]=(g[n]||0)+1});
    return `<tr data-i="${i}"><td class="sk">${dt(c.date)}</td><td class="nm"><b>${esc(c.msg.split('\n')[0])}</b><small>${esc(c.author||'')} · ${c.sha.slice(0,7)}</small></td><td class="ct">${Object.entries(g).map(([n,k])=>esc(n)+(k>1?' ×'+k:'')).join(', ')||'—'}</td><td>${c.files.length?'<button class="ebtn">Отменить</button>':''}</td></tr>`}).join('')}</tbody></table>
    <div class="hint" style="margin-top:12px">«Отменить» возвращает файлы этого сохранения в состояние до него — новым сохранением, поэтому отмену тоже можно отменить. Если эти же файлы меняли позже, более поздние правки в них тоже откатятся.</div>`;
  $('vw').querySelectorAll('tr[data-i] .ebtn').forEach(b=>b.onclick=()=>revert(HIST[+b.closest('tr').dataset.i]))}
async function revert(c){if(dirtyCount())return toast('Сначала сохраните или отмените несохранённые изменения',true);
  const names=[...new Set(c.files.map(f=>fname(f.path)))].join(', ');
  if(!confirm(`Отменить «${c.msg.split('\n')[0]}» от ${dt(c.date)}?\n\nФайлы (${names}) вернутся к состоянию до этого сохранения. Более поздние правки этих файлов тоже откатятся.`))return;
  $('busy').classList.add('on');
  try{await api('/api/revert',{sha:c.sha});HIST=null;toast('Отменено. Сайт обновится примерно через 1–2 минуты.');await load()}
  catch(e){toast('Не получилось отменить: '+e.message,true)}finally{$('busy').classList.remove('on')}}
if(TOK)load();else showLogin();
</script>
