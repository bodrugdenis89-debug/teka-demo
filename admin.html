<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title data-i18n>Teka — админка</title>
<link rel="icon" href="assets/teka-logo-sq.svg">
<link rel="manifest" href="/manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEKA админ">
<meta name="theme-color" content="#C8102E">
<style>
:root{--red:#E30613;--ink:#141414;--ink2:#3a3a3a;--mute:#767676;--line:#E6E6E6;--soft:#F5F5F5;--ok:#1A7F37;--warn:#B26B00;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:500 14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--soft)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.btn{height:38px;padding:0 16px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#bbb}
a.btn{text-decoration:none}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.r:hover{background:#c40511}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input.t,select.t,textarea.t{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;width:100%}
textarea.t{height:auto;padding:10px 12px;resize:vertical;min-height:90px}
input.t:focus,select.t:focus,textarea.t:focus{outline:2px solid #111;outline-offset:-1px;border-color:transparent}
/* вход */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--soft);z-index:50}
#login[hidden]{display:none}
#login form{background:#fff;border-radius:16px;padding:36px;width:min(360px,92vw);display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
#login img{width:76px;height:76px;justify-self:start}
#login h1{font-size:20px}
#login .er{color:var(--red);min-height:20px;font-size:13px}
/* шапка */
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
header{display:grid;grid-template-columns:auto minmax(0,1fr)}
.hlg{grid-row:1/3;display:block;width:88px;background:#C8102E}.hlg img{display:block;width:100%;height:100%;object-fit:contain}
.hb{display:flex;align-items:center;gap:12px;padding:12px 20px 8px 24px;flex-wrap:wrap}
.hb .lg{font-weight:700;font-size:18px;margin-right:8px}
.hb .q{flex:1 1 260px;max-width:420px}
.hb .sp{flex:1}
.hb select.t{width:auto;min-width:150px}
/* выпадающие списки */
.dd{position:relative}
.dd>button{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 38px 0 14px;font-weight:600;min-width:180px;text-align:left;position:relative;white-space:nowrap;width:100%}
.dd>button:hover{border-color:#bbb}
.dd>button:after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.dd.on>button{border-color:var(--ink)}
.dd.on>button:after{transform:translateY(-20%) rotate(-135deg)}
.dd ul{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.13);padding:6px;list-style:none;z-index:40;display:none;max-height:70vh;overflow:auto}
.dd.on ul{display:block}
.dd li{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;white-space:nowrap}
.dd li:hover{background:var(--soft)}
.dd li span{flex:1}
.dd li small{color:var(--mute);font-weight:600;font-size:12.5px;background:var(--soft);border-radius:20px;padding:1px 8px}
.dd li:hover small{background:#fff}
.dd li.sel{color:var(--red);font-weight:700}
td.st .dd>button,#ed .dd>button,#tl .dd>button{min-width:0}
td.st .dd>button{height:34px;width:140px;font-weight:600}
td.st .dd.order>button,td.st .dd.out>button{color:var(--warn);border-color:#f0d9b5;background:#FFFAF0}
#ed .dd>button,#tl .dd>button{font-weight:500}
.dd li.sel:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:-10px;flex:none}
/* таблица */
main{padding:16px 20px 120px}
#tw{overflow-x:auto;border-radius:12px}
.sum{color:var(--mute);margin:0 0 10px 2px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:10px 10px;border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.dz td{background:#FFF8E6}
tr.hd td{opacity:.55}
tr.hd td:last-child,tr.hd td:nth-last-child(2){opacity:1}
td.ph{width:64px}
td.ph img{width:52px;height:52px;object-fit:contain;border-radius:6px;background:#fff;border:1px solid var(--line);display:block}
td.nm b{display:block;font-size:14.5px}
td.nm small{display:block;color:var(--mute);font-size:12.5px;max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.nm .kb{display:inline-block;font-size:10px;font-weight:700;background:#000;color:#fff;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:2px}
td.sk{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
td.ct{color:var(--ink2);font-size:13px;max-width:150px}
td.pr input{width:96px;height:34px;text-align:right;font-variant-numeric:tabular-nums}
td.pr .pc{display:block;font-size:11.5px;color:var(--red);text-align:right;min-height:14px}
td.st select{height:34px;width:132px}
td.st select.order,td.st select.out{color:var(--warn)}
.eye{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.eye.off{color:var(--red);border-color:#f3b3b6;background:#FFF1F1}
.ebtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.ebtn:hover{border-color:#999}
.empty{padding:60px;text-align:center;color:var(--mute);background:#fff;border-radius:12px;border:1px solid var(--line)}
/* панель сохранения */
#bar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);transition:transform .25s;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-width:calc(100vw - 32px)}
#bar.on{transform:translate(-50%,0)}
#bar .btn{border:0}
#bar .btn.g{background:#333;color:#fff}
/* редактор */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#ov.on{opacity:1;pointer-events:auto}
#ed,#tl{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:#fff;z-index:31;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
#tl{z-index:32}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.oc{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;cursor:grab;user-select:none;transition:box-shadow .15s}
.oc:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.oc img{width:100%;aspect-ratio:1;object-fit:contain;display:block;pointer-events:none}
.oc b{display:block;font-size:13px;line-height:1.25;margin-top:6px;overflow-wrap:anywhere}
.oc small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.oc .n{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:2px 8px}
.oc .ob{display:flex;gap:4px;margin-top:8px}
.oc .ob button{flex:1;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-size:13px;line-height:1}
.oc .ob button:hover{border-color:var(--ink)}
.oc .ob button:disabled{opacity:.3;cursor:default}
.oc.dg{opacity:.35}.oc.ov{outline:2px solid var(--red);outline-offset:2px}.oc.hd{opacity:.55}
#ed.on,#tl.on{transform:none}
.eh{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}
.eh h2{font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eb{flex:1;overflow:auto;padding:8px 24px 40px}
.ef{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);align-items:center}
.ef .sp{flex:1}
.ef .del{color:var(--red);font-weight:600;padding:0 6px}
fieldset{border:0;padding:18px 0;border-bottom:1px solid var(--line)}
fieldset:last-child{border-bottom:0}
legend{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding:0;margin-bottom:12px;float:left;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;clear:both}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;clear:both}
.g1{display:grid;gap:12px;clear:both}
label.f,div.f{display:grid;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:600}
label.f small{font-weight:500;color:var(--mute)}
label.ck{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:22px}
label.ck input{width:18px;height:18px;accent-color:var(--red)}
.hint{font-size:12.5px;color:var(--mute);clear:both;margin-top:8px}
.f.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;clear:both}
.chip{height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--ink2)}
.chip:hover{border-color:#999}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on:before{content:"✓ "}
/* фото */
.phs{display:flex;flex-wrap:wrap;gap:10px;clear:both}
.phs .p{width:112px;height:112px;border:1px solid var(--line);border-radius:10px;position:relative;background:#fff;cursor:grab}
.phs .p img{width:100%;height:100%;object-fit:contain;border-radius:10px;pointer-events:none}
.phs .p:first-child{border:2px solid var(--ink)}
.phs .p:first-child:after{content:"Главное";position:absolute;left:6px;bottom:6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
html[lang=ro] .phs .p:first-child:after{content:"Principală"}
.phs .p.new:before{content:"новое";position:absolute;right:6px;bottom:6px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.phs .p button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.phs .p button:hover{background:var(--red);color:#fff;border-color:var(--red)}
.phs .p.dg{opacity:.4}
.phs.one .p,.phs.one .add{width:150px;height:150px;cursor:default}
.phs.one .p:first-child{border:1px solid var(--line)}.phs.one .p:first-child:after{content:none}
.imp{display:flex;gap:8px;clear:both;width:100%}.imp .t{flex:1;width:auto;min-width:0}.imp .btn{flex:none}
#e_imps.er{color:var(--red)}
.phs .add{width:112px;height:112px;border:2px dashed #ccc;border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;padding:8px}
.phs .add:hover,.phs .add.drop{border-color:var(--ink);color:var(--ink)}
/* характеристики */
.sg{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;clear:both}
.sg .st{display:flex;gap:8px;margin-bottom:8px}
.sg .st input{font-weight:700}
.sr{display:grid;grid-template-columns:1.2fr 1fr 30px;gap:6px;margin-top:6px}
.sr input.t{height:32px;font-size:13px}
.x{width:30px;height:32px;border-radius:6px;color:var(--mute);font-size:18px}
.x:hover{background:#FFF1F1;color:var(--red)}
.lnk{color:var(--ink);font-weight:600;font-size:13px;margin-top:8px;padding:4px 0}
.lnk:hover{color:var(--red)}
/* уведомления */
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-150%);transition:transform .25s;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100vw - 32px)}
#toast.on{transform:translate(-50%,0)}
#toast.er{background:var(--red)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;place-items:center;z-index:70;font-weight:700}
#busy.on{display:grid}
/* разделы */
.tabs{display:flex;gap:2px;padding:0 20px 0 10px;overflow-x:auto}
.tabs button{padding:9px 14px 11px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.tabs button i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:6px}
.iv{display:none}body.v-items .iv,body.v-check .iv{display:contents}
.vh{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap;min-height:38px}
.vh .sum{margin:0 auto 0 2px}
#vb{display:flex;gap:8px;flex-wrap:wrap}
th.cb,td.cb{width:36px;padding-right:0}
th.cb input,td.cb input{width:17px;height:17px;accent-color:var(--red);display:block}
td.od input{width:64px;height:34px;text-align:center}
.tg{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;background:var(--ink);color:#fff}
.tg.hit{background:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--ink2);white-space:nowrap;margin:2px 4px 2px 0}
.pill.on,.pill.done{background:#E7F5EC;color:var(--ok)}.pill.plan,.pill.work{background:#FFF6E5;color:var(--warn)}.pill.new,.pill.bad{background:#FFF1F1;color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 24px 8px;max-width:960px}
.pv{width:100%;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-top:4px;clear:both}
.pv td,.pv th{padding:6px 10px}
.pv td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pv s{color:var(--mute)}.pv .up{color:var(--red);font-weight:700}.pv .dn{color:var(--ok);font-weight:700}
.res{display:grid;gap:2px;margin-top:6px;max-height:260px;overflow:auto}
.res button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:8px}
.res button:hover{background:var(--soft)}
.res img{width:36px;height:36px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.res small{color:var(--mute)}
.pbr{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.pbh{display:flex;gap:8px;flex-wrap:wrap}.pbh .dd,.pbh select{flex:1 1 260px}.pbh input{flex:1 1 180px}
.pbl{display:grid;max-height:360px;overflow:auto;margin-top:8px}.pbl:empty{display:none}.pbl label{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}.pbl label:hover{background:var(--soft)}
.pbl input{width:18px;height:18px;flex:none;accent-color:var(--red)}.pbl img{width:40px;height:40px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;flex:none}.pbl span{flex:1;display:grid}.pbl small{color:var(--mute)}.pbl em{font-style:normal;font-weight:600;white-space:nowrap}
.chip.x2:after{content:" ×";color:var(--mute)}
.chip:disabled{opacity:.45;cursor:default}
.drop{border:2px dashed #ccc;border-radius:12px;padding:28px;text-align:center;color:var(--mute);font-weight:600;clear:both}
.drop.on{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;clear:both}.kv b{color:var(--mute);font-weight:600}
.warnb{background:#FFF8E6;border:1px solid #f0d9b5;border-radius:10px;padding:10px 14px;font-size:13px;margin-top:10px;clear:both}
@media (max-width:900px){.hlg{width:60px}.hb{padding-left:14px}.tabs{padding-left:0}.hb .q{max-width:none;flex-basis:100%;order:5}.v-items td.ct,.v-items th.ct,.v-items td.sk,.v-items th.sk,.v-check td.ct,.v-check th.ct,.v-check td.sk,.v-check th.sk{display:none}#vw{overflow-x:auto}.g2,.g3{grid-template-columns:1fr}.eh,.eb,.ef{padding-left:16px;padding-right:16px}main{padding:12px 8px 120px}}
html[lang=ro] .phs .p.new:before{content:"nouă"}
.lsw{display:inline-flex;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;flex:none}
.lsw button{padding:0 12px;font-weight:700;font-size:13px;color:var(--mute)}
.lsw button:hover{color:var(--ink)}
.lsw button.on{background:var(--ink);color:#fff}
#login form{position:relative}#login .lsw{position:absolute;top:20px;right:20px;height:32px}
.pv td.oi{display:flex;align-items:center;gap:12px}.pv td.oi img{width:48px;height:48px;flex:none;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.dbtn{height:34px;padding:0 11px;margin-left:6px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}.dbtn:hover{border-color:var(--ink)}
.odel{width:36px;height:36px;margin-left:8px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mute);display:inline-grid;place-items:center;vertical-align:middle;cursor:pointer;transition:color .15s,border-color .15s}.odel:hover{color:var(--red);border-color:var(--red)}
.tg.ref{background:#2F6F4F;color:#fff}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* вкладка-ссылка «Учёт» */
.tabs a.tabl{padding:9px 14px 11px;font-weight:700;color:var(--red);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-left:auto}
.tabs a.tabl:hover{border-bottom-color:var(--red)}
/* телефон */
@media (max-width:700px){
header{position:static;display:block}
.hlg{display:none}
.hb{padding:10px 12px 6px;gap:8px}
.hb .lg{order:0;flex:1 1 auto;font-size:19px;margin:0}
.hb>a.btn{order:1}.hb .lsw{order:2}.hb #lo{order:3}
.hb>a.btn,.hb .lsw,.hb #lo,.hb .lsw button{height:36px}.hb>a.btn,.hb #lo{padding:0 11px}
.hb .sp{display:none}
.hb .q{order:5;flex:1 1 150px}
.hb #nw{order:6;padding:0 12px}
.hb .dd,.hb select.t{order:7;flex:1 1 40%;min-width:0}
.hb .dd>button{min-width:0}
.tabs{padding:0 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.tabs a.tabl{padding:10px 11px 12px;font-size:14.5px}
.tabs a.tabl{margin-left:0;order:-1}
main{padding:10px 10px 130px}
.vh{gap:8px}.vh .sum{flex:1 1 100%;margin:0 0 0 2px}
#vb{width:100%}#vb>*{flex:1 1 auto}#vb .dd{min-width:0}#vb .dd>button{min-width:0}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-10px!important;margin-right:-10px!important;padding:0 10px}.chips::-webkit-scrollbar{display:none}.chip{flex:none}
#ed .chips,#tl .chips{flex-wrap:wrap;overflow:visible;margin:0!important;padding:0}
#tw,#vw{overflow:visible;border-radius:0}
#tw>table,#vw>table{display:block;border:0;background:none;border-radius:0;overflow:visible}
#tw>table>thead,#vw>table>thead{display:none}
#tw>table>tbody,#vw>table>tbody{display:block}
#tw>table>tbody>tr,#vw>table>tbody>tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
#tw>table>tbody>tr>td,#vw>table>tbody>tr>td{display:block;padding:0;border:0;background:none;min-width:0}
#tw tr.dz,#vw tr.dz{background:#FFF8E6}
td.nm{flex:1 1 100%}

function dd(sel){

  if(!w){w=document.createElement('div');w.className='dd';sel.after(w);sel.hidden=true;sel._dd=w;
    w.addEventListener('click',e=>{const li=e.target.closest('li');
      if(li){sel.value=li.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}));w.classList.remove('on');dd(sel);return}
      if(e.target.closest('button')){const o=w.classList.contains('on');ddClose();if(!o){w.classList.add('on');ddPlace(w)}}})}
  const sp=t=>{const m=t.match(/^(.*?)\s*\((\d+)\)$/);return m?[m[1],m[2]]:[t,'']};
  w.className='dd '+(sel.value||'');const cur=sel.options[sel.selectedIndex];
  w.innerHTML=`<button type="button">${esc(sp(cur?cur.text:'')[0])}</button><ul>${[...sel.options].map(o=>{const [t,n]=sp(o.text);return `<li data-v="${esc(o.value)}" class="${o.value===sel.value?'sel':''}"><span>${esc(t)}</span>${n?`<small>${n}</small>`:''}</li>`}).join('')}</ul>`}

function ddPlace(w){const b=w.querySelector('button').getBoundingClientRect(),u=w.querySelector('ul');u.style.minWidth=b.width+'px';u.style.left=Math.min(b.left,innerWidth-u.offsetWidth-8)+'px';

const dirtyCount=()=>DIRTY.size+[...CHG].filter(f=>f.startsWith('-')).length+(PM.dirty?1:0)+(SC.dirty?1:0);
function bar(){const n=DIRTY.size,d=[...CHG].filter(f=>f.startsWith('-')).length,ex=[PM.dirty?T('акции'):'',SC.dirty?T('контакты'):''].filter(Boolean);

$('bs').onclick=save;
async function save(){
  const fs=[...new Set([...CHG].map(f=>f.replace(/^-/,'')))].filter(f=>DB[f]);
  const files=fs.map(f=>({path:`data/${f}.json`,text:dump(DB[f].items),base:DB[f].sha}));
  if(RU.dirty)files.push({path:'data/ru.json',text:JSON.stringify(RU.data,null,1).replace(/^ +/gm,''),base:RU.sha});
  if(PM.dirty)files.push({path:'data/promo.json',text:dump(PM.data),base:PM.sha});
  if(SC.dirty)files.push({path:'data/site.json',text:dump(SC.data),base:SC.sha});
  const used=new Set(fs.flatMap(f=>DB[f].items.flatMap(x=>[...(x.u||[]),x.label,x.draw,...(x.pdf||[])].filter(Boolean))).concat(PM.dirty?PM.data.promos.map(p=>p.img).filter(Boolean):[]));
  for(const [p,u] of Object.entries(UP))if(used.has(p))files.push({path:p,b64:u.b64});
  if(!files.length){CHG.clear();bar();return}
  const names=[...DIRTY].map(nm).filter(Boolean);
  const ex=[PM.dirty?'акции':'',SC.dirty?'контакты':''].filter(Boolean);
  const msg='Админка: '+[names.length?names.slice(0,6).join(', ')+(names.length>6?` и ещё ${names.length-6}`:''):'',ex.join(', ')].filter(Boolean).join('; ')||'Админка: изменения в каталоге';
  $('busy').classList.add('on');
  try{const r=await api('/api/commit',{message:msg,files});
    fs.forEach(f=>DB[f].sha=r.shas[`data/${f}.json`]);if(RU.dirty){RU.sha=r.shas['data/ru.json'];RU.dirty=false}
    if(PM.dirty){PM.sha=r.shas['data/promo.json'];PM.dirty=false}if(SC.dirty){SC.sha=r.shas['data/site.json'];SC.dirty=false}HIST=null;
    for(const p of Object.keys(UP))if(used.has(p))UP[p].saved=true;
    DIRTY.clear();CHG.clear();bar();render();toast(T('Сохранено. Сайт обновится примерно через 1–2 минуты.'))}
  catch(e){toast(e.status===409?T('Кто-то изменил каталог в другом окне. Обновите страницу (ваши правки не сохранены).'):T('Не сохранилось: {0}',e.message),true)}
  finally{$('busy').classList.remove('on')}}

/* поле фильтра: варианты берём из товаров этой категории */
function filt(k,v,f){
  const L=XL[k]?T(XL[k]):k,vl=VL[k]||{},seen=new Set();
  DB[f].items.forEach(y=>{const z=y[k];(Array.isArray(z)?z:[z]).forEach(e=>{if(e!==''&&e!=null)seen.add(String(e))})});
  Object.keys(vl).forEach(e=>{if(Array.isArray(v)||seen.size)seen.add(e)});
  const nm=e=>vl[e]?T(vl[e]):e;
  const vals=[...seen].sort((a,b)=>isNaN(a)||isNaN(b)?nm(a).localeCompare(nm(b)):a-b);
  if(Array.isArray(v))return `<div class="f wide"><span>${esc(L)}</span><div class="chips" data-xa="${esc(k)}">${vals.map(e=>`<button type="button" class="chip ${v.map(String).includes(e)?'on':''}" data-v="${esc(e)}">${esc(nm(e))}</button>`).join('')}</div></div>`;
  if(TXTK.has(k))return `<label class="f">${esc(L)}<input class="t" data-x="${esc(k)}" value="${esc(v)}"></label>`;
  const cur=String(v??'');if(cur&&!vals.includes(cur))vals.push(cur);
  return `<label class="f">${esc(L)}<select class="t" data-x="${esc(k)}" data-cur="${esc(cur)}"><option value="">—</option>${vals.map(e=>`<option value="${esc(e)}" ${e===cur?'selected':''}>${esc(nm(e))}${NUMK.has(k)&&!vl[e]&&(k==='w'||k==='width')?' '+T('см'):''}</option>`).join('')}<option value="__new">${T('+ Другое значение…')}</option></select></label>`}

const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'p';
async function upImg(file,base,raw){const bm=await createImageBitmap(file);const M=1600,s=Math.min(1,M/Math.max(bm.width,bm.height));
  let c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
  const W=c.width,H=c.height,px=g.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;if(px[i]<240||px[i+1]<240||px[i+2]<240){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(!raw&&x1>=0&&(x0>2||y0>2||x1<W-3||y1<H-3)){const bw=x1-x0+1,bh=y1-y0+1,sd=Math.round(Math.max(bw,bh)*1.08),q=document.createElement('canvas');q.width=q.height=sd;
    const k=q.getContext('2d');k.fillStyle='#fff';k.fillRect(0,0,sd,sd);k.drawImage(c,x0,y0,bw,bh,Math.round((sd-bw)/2),Math.round((sd-bh)/2),bw,bh);c=q;
    if(Math.max(bw,bh)<600)toast(T('Фото маленькое ({0} px) — на сайте может быть нечётким. Лучше скачать крупное фото.',Math.max(bw,bh)),true)}
  let url=c.toDataURL('image/webp',.86),ext='webp';if(!url.startsWith('data:image/webp')){url=c.toDataURL('image/jpeg',.88);ext='jpg'}
  const path=`assets/u/${slug(base)}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.${ext}`;
  UP[path]={url,b64:url.split(',')[1]};return path}

async function gtr(a,sl='ro',tl='ru'){const o=[];let ch=[],n=0;

async function specRu(S){const k=RU.data.k||{},v=RU.data.v||{},nk=new Set(),nv=new Set();

    else if(ch==='"')q=true;else if(ch===d){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);R.push(row);row=[];c=''}else c+=ch}

async function delOrder(id){if(!confirm(T('Удалить этот заказ? Это нельзя отменить.')))return;

async function setOst(id,st){const o=ORD&&ORD.find(z=>z.id===id),was=o&&o.st;if(o){o.st=st;navOrders();if(VIEW==='orders')drawOrders()}
  try{await api('/api/order-status',{id,st});oFix(id,{st});toast(T('Статус: {0}',OSL(st)));return true}catch(e){if(o){o.st=was;navOrders();if(VIEW==='orders')drawOrders()}toast(T('Не удалось изменить статус: {0}',e.message),true);return false}}

/* документ заказа (страница desk-offer.html): печать, PDF, отправка клиенту */
async function orderDoc(id,act){if(!window.tkSend)return toast(T('Не удалось загрузить: {0}','tk-send.js'),true);toast(T('Готовим документ…'));
  let o,d;try{o=await api('/api/order?id='+encodeURIComponent(id));
    const ex=o.items.map(i=>{const z=allItems().find(({x})=>String(x.sku)===String(i.sku));return z?{sku:String(i.sku),f:z.f,img:pics(z.x)[0]||'',sub:typeof z.x.sub==='string'?z.x.sub.slice(0,200):''}:{sku:String(i.sku)}});
    d=await api('/api/order-doc',{id,items:ex})}catch(e){return toast(e.message,true)}
  docAct(d.id,act,{tot:o.tot,name:o.name,tel:o.tel,lang:o.lang,kind:'order'})}
function docAct(did,act,o){const url='desk-offer.html?o='+did+'&nv=1&l='+LANG,link=location.href.replace(/[^/]*$/,'')+'desk-offer.html?o='+did+'&l='+LANG;
  if(act==='print')return tkSend.print(url);if(act==='pdf')return tkSend.pdf(url);
  tkSend.open({url,link,no:did,tot:o.tot,name:o.name||'',tel:o.tel||'',lang:LANG,kind:o.kind})}

const TAGS0=['дизайнер','застройщик','повторный','VIP'];
const ddate=t=>t?new Date(t).toLocaleDateString(LOC()):'—';
async function drawClients(){
  if(!CLS){$('vw').innerHTML=LOADING();try{CLS=cApply((await api('/api/clients')).clients)}catch(e){if(e.status!==401)$('vw').innerHTML=`<div class="empty">${T('Не удалось загрузить: {0}',esc(e.message))}</div>`;return}if(VIEW!=='clients')return}

    .sort(CLO==='tot'?(a,b)=>(b.tot||0)-(a.tot||0):CLO==='nm'?(a,b)=>(a.n||'').localeCompare(b.n||''):(a,b)=>(b.last||0)-(a.last||0));

  $('vb').innerHTML=`<input class="t" id="clq" type="search" placeholder="${T('Имя или телефон')}" value="${esc(CLQ)}" style="width:220px">
   <select class="t" id="clm"><option value="">${T('Все менеджеры')}</option>${MG.map(m=>`<option value="${esc(m)}" ${CLM===m?'selected':''}>${esc(MGN(m))}</option>`).join('')}</select>
   <select class="t" id="clt"><option value="">${T('Все теги')}</option>${TG.map(m=>`<option value="${esc(m)}" ${CLT===m?'selected':''}>${esc(T(m))}</option>`).join('')}</select>
   <select class="t" id="clo"><option value="last" ${CLO==='last'?'selected':''}>${T('Сначала недавние')}</option><option value="tot" ${CLO==='tot'?'selected':''}>${T('По сумме заказов')}</option><option value="nm" ${CLO==='nm'?'selected':''}>${T('По имени')}</option></select>
   <button class="btn" id="clx">${T('Экспорт CSV')}</button><button class="btn" id="clr">${T('Обновить')}</button><button class="btn r" id="cln">${T('+ Новый клиент')}</button>`;
  ['clm','clt','clo'].forEach(i=>{dd($(i));$(i).onchange=e=>{({clm:v=>CLM=v,clt:v=>CLT=v,clo:v=>CLO=v})[i](e.target.value);drawClients()}});
  let qt2;$('clq').oninput=e=>{clearTimeout(qt2);qt2=setTimeout(()=>{CLQ=e.target.value;drawClients();const i=$('clq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('clr').onclick=()=>{CLS=null;drawClients()};$('cln').onclick=()=>openClient();$('clx').onclick=()=>csvOut(L);
  $('vw').innerHTML=L.length?`<table><thead><tr><th>${T('Клиент')}</th><th>${T('Город')}</th><th>${T('Менеджер')}</th><th>${T('Теги')}</th><th>${T('Заказы')}</th><th>${T('Подборки')}</th><th>${T('Сумма заказов')}</th><th>${T('Последний контакт')}</th><th></th></tr></thead><tbody>${L.map(c=>`<tr data-t="${esc(c.tel)}"><td class="nm"><b>${esc(c.n||T('без имени'))}</b><small>${esc(c.tel)}</small></td><td class="ct">${esc(c.c||'—')}</td><td class="ct">${esc(MGN(c.mg)||'—')}</td>
    <td>${(c.tg||[]).map(t=>`<span class="pill">${esc(T(t))}</span>`).join('')||'—'}</td><td class="sk">${c.no||0}</td><td class="sk">${c.nf||0}</td><td class="sk"><b>${(c.tot||0).toLocaleString(LOC())} MDL</b></td><td class="sk">${ddate(c.last)}</td><td><button class="ebtn">${T('Изменить')}</button><button class="odel" data-k="cdel" title="${T('Удалить клиента')}" aria-label="${T('Удалить клиента')}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></td></tr>`).join('')}</tbody></table>
    <div class="hint" style="margin-top:12px">${T('Клиенты появляются автоматически из заказов и подборок, где указан телефон. Сумма — по заказам без отменённых.')}</div>`:`<div class="empty">${T('Клиентов пока нет. Добавьте вручную кнопкой «+ Новый клиент» — или они появятся сами из заказов и подборок менеджеров с телефоном.')}</div>`;
  $('vw').querySelectorAll('tr[data-t] .ebtn').forEach(b=>b.onclick=()=>openClient(b.closest('tr').dataset.t));$('vw').querySelectorAll('tr[data-t] [data-k=cdel]').forEach(b=>b.onclick=()=>delClient(b.closest('tr').dataset.t))}
async function delClient(tel){const k=(CLS||[]).find(x=>x.tel===tel);if(!confirm(T('Удалить клиента {0}? Его заказы останутся в журнале заказов.',(k&&k.n?k.n+' ':'')+tel)))return;
  try{await api('/api/client-del',{tel});cFix(tel,{del:1});CLS=(CLS||[]).filter(x=>x.tel!==tel);tlClose();drawClients();toast(T('Клиент удалён'))}catch(e){toast(T('Не удалось удалить: {0}',e.message),true)}}
let CFIX={};try{CFIX=JSON.parse(localStorage.getItem('tkCFix')||'{}')}catch(_){}
function cFix(tel,v){const now=Date.now();CFIX[tel]={...v,u:now+150000};for(const k in CFIX)if(CFIX[k].u<now)delete CFIX[k];try{localStorage.setItem('tkCFix',JSON.stringify(CFIX))}catch(_){}}
const cApply=L=>{const now=Date.now(),A=L.filter(c=>!(CFIX[c.tel]&&CFIX[c.tel].u>now&&CFIX[c.tel].del)).map(c=>CFIX[c.tel]&&CFIX[c.tel].u>now&&CFIX[c.tel].row?{...c,...CFIX[c.tel].row}:c);for(const t in CFIX)if(CFIX[t].u>now&&CFIX[t].row&&!A.some(c=>c.tel===t))A.push({tel:t,tot:0,last:0,no:0,nf:0,...CFIX[t].row});return A};
function csvOut(L){const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const t='﻿'+[['Имя','Телефон','Город','Менеджер','Теги','Заказов','Подборок','Сумма заказов, MDL','Последний контакт'].map(h=>c(T(h))).join(';')].concat(L.map(k=>[k.n,k.tel,k.c,MGN(k.mg),(k.tg||[]).join(', '),k.no||0,k.nf||0,k.tot||0,ddate(k.last)].map(c).join(';'))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='teka-clients-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function openClient(tel){let c;const nw=!tel;if(nw)c={tel:'',name:'',city:'',addr:'',mg:'',notes:'',tags:[],orders:[],offers:[]};else try{c=await api('/api/client?tel='+encodeURIComponent(tel))}catch(e){return toast(e.message,true)}
  const MG=[...new Set((CLS||[]).map(k=>k.mg).concat(ORD?ORD.map(o=>o.mg):[]).filter(Boolean))].sort();
  const tags=[...new Set(TAGS0.concat(c.tags||[]))];
  tlOpen(nw?T('Новый клиент'):(c.name||T('Клиент'))+' · '+c.tel,`
  <fieldset><legend>${T('Карточка')}</legend><div class="g3" style="margin-bottom:12px"><label class="f">${T('Телефон')}<input class="t" id="c_t" type="tel" placeholder="+373 6X XXX XXX" value="${esc(c.tel)}"></label></div><div class="g3">
   <label class="f">${T('Имя')}<input class="t" id="c_n" value="${esc(c.name)}"></label>
   <label class="f">${T('Город')}<input class="t" id="c_c" value="${esc(c.city)}"></label>
   <label class="f">${T('Кто ведёт')}<input class="t" id="c_m" value="${esc(c.mg)}" list="c_ml" placeholder="${T('Менеджер')}"><datalist id="c_ml">${MG.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></label></div>
   <div class="g1" style="margin-top:12px"><label class="f">${T('Адрес')}<input class="t" id="c_a" value="${esc(c.addr)}"></label>
   <label class="f">${T('Заметки')}<textarea class="t" id="c_no" rows="4">${esc(c.notes)}</textarea></label>
   <div class="f">${T('Теги')}<div class="chips" id="c_tg">${tags.map(t=>`<button type="button" class="chip ${(c.tags||[]).includes(t)?'on':''}" data-v="${esc(t)}">${esc(T(t))}</button>`).join('')}<input class="t" id="c_nt" placeholder="${T('+ свой тег')}" style="width:140px;height:34px"></div></div></div>
   <div class="kv" style="margin-top:14px"><b>${T('Сумма заказов')}</b><span><b>${(c.tot||0).toLocaleString(LOC())} MDL</b> ${T('(без отменённых)')}</span><b>${T('Первый контакт')}</b><span>${ddate(c.first)}</span><b>${T('Последний контакт')}</b><span>${ddate(c.last)}</span></div></fieldset>
  <fieldset><legend>${T('Заказы')} (${c.orders.length})</legend>${c.orders.length?`<table class="pv"><thead><tr><th>${T('Дата')}</th><th>${T('Статус')}</th><th>${T('Менеджер')}</th><th>${T('Подборка')}</th><th style="text-align:right">${T('Сумма')}</th></tr></thead><tbody>${c.orders.map(o=>`<tr><td>${dt(o.t)}</td><td><span class="pill ${o.st}">${OS[o.st]?OSL(o.st):esc(o.st)}</span></td><td>${esc(MGN(o.mg)||'—')}</td><td>${o.of?`№${esc(o.of)}`:'—'}</td><td class="n"><b>${(o.tot||0).toLocaleString(LOC())}</b></td></tr>`).join('')}</tbody></table>`:`<div class="hint">${T('Заказов нет')}</div>`}</fieldset>
  ${nw?'':`<div style="margin:4px 0 8px"><button type="button" class="btn" id="c_del" style="color:var(--red);border-color:var(--red)">${T('Удалить клиента')}</button></div>`}<fieldset><legend>${T('Подборки')} (${c.offers.length})</legend>${c.offers.length?`<table class="pv"><thead><tr><th>${T('Дата')}</th><th>${T('Подборка')}</th><th>${T('Менеджер')}</th><th style="text-align:right">${T('Сумма')}</th></tr></thead><tbody>${c.offers.map(o=>`<tr><td>${dt(o.t)}</td><td><a href="desk-offer.html?o=${esc(o.id)}&nv=1" target="_blank" rel="noopener">№${esc(o.id)} ↗</a></td><td>${esc(MGN(o.mg)||'—')}</td><td class="n"><b>${(o.tot||0).toLocaleString(LOC())}</b></td></tr>`).join('')}</tbody></table>`:`<div class="hint">${T('Подборок нет')}</div>`}</fieldset>`,
  FT(T('Сохранить')),{click:e=>{const b=e.target.closest('#c_tg .chip');if(b)b.classList.toggle('on');if(e.target.closest('#c_del'))delClient(c.tel)},
   act:{ok:async()=>{const nt=$('c_nt').value.trim();const tg=[...$('c_tg').querySelectorAll('.chip.on')].map(b=>b.dataset.v).concat(nt?[nt]:[]);
     const tel=$('c_t').value.trim(),dg=tel.replace(/\D/g,''),chg=!nw&&dg.slice(-8)!==c.tel.replace(/\D/g,'').slice(-8);if(dg.length<8||dg.length>15||/[^\d\s+()-]/.test(tel)){$('c_t').focus();return toast(T('Укажите телефон клиента'),true)}
     if((nw||chg)&&(CLS||[]).some(k=>k.tel!==c.tel&&k.tel.replace(/\D/g,'').endsWith(tel.replace(/\D/g,'').replace(/^0/,'').slice(-8)))&&!confirm(T('Клиент с таким телефоном уже есть. Обновить его карточку?')))return;
     try{const r=await api('/api/client',{tel,...(chg?{old:c.tel}:{}),name:$('c_n').value.trim(),city:$('c_c').value.trim(),addr:$('c_a').value.trim(),mg:$('c_m').value.trim(),notes:$('c_no').value,tags:tg});
       if(chg){cFix(c.tel,{del:1});if(CLS)CLS=CLS.filter(x=>x.tel!==c.tel)}const row={n:r.name,c:r.city,mg:r.mg,tg:r.tags,tot:r.tot||0,last:r.last||0,no:(r.orders||[]).length,nf:(r.offers||[]).length};cFix(r.tel,{row});
       const k=(CLS||[]).find(x=>x.tel===r.tel);if(k)Object.assign(k,row);else if(CLS)CLS.push({tel:r.tel,...row});tlClose();drawClients();toast(nw?T('Клиент добавлен'):T('Клиент сохранён'))}catch(e){toast(T('Не сохранилось: {0}',e.message),true)}}}});
  $('c_nt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){e.target.insertAdjacentHTML('beforebegin',`<button type="button" class="chip on" data-v="${esc(v)}">${esc(T(v))}</button>`);e.target.value=''}}}}

/* история */
let HIST=null;
const fname=p=>{const m=p.match(/^data\/(.+)\.json$/);return m?(FN[m[1]]||T({ru:'Переводы RU',promo:'Акции',site:'Контакты и тексты'}[m[1]]||'')||m[1]):T('фото')};
async function drawHist(){$('sum').textContent=T('Последние сохранения каталога');
  $('vb').innerHTML=`<button class="btn" id="href">${T('Обновить')}</button>`;$('href').onclick=()=>{HIST=null;drawHist()};
  if(!HIST){$('vw').innerHTML=`<div class="empty">${T('Загружаю историю…')}</div>`;try{HIST=await api('/api/history')}catch(e){if(e.status!==401)$('vw').innerHTML=`<div class="empty">${T('Не удалось загрузить историю: {0}',esc(e.message))}</div>`;return}if(VIEW!=='hist')return}
  if(!HIST.length){$('vw').innerHTML=`<div class="empty">${T('Сохранений пока нет')}</div>`;return}
  $('vw').innerHTML=`<table><thead><tr><th>${T('Когда')}</th><th>${T('Что сохранили')}</th><th>${T('Файлы')}</th><th></th></tr></thead><tbody>${HIST.map((c,i)=>{const g={};c.files.forEach(f=>{const n=fname(f.path);g[n]=(g[n]||0)+1});
    return `<tr data-i="${i}"><td class="sk">${dt(c.date)}</td><td class="nm"><b>${esc(c.msg.split('\n')[0])}</b><small>${esc(c.author||'')} · ${c.sha.slice(0,7)}</small></td><td class="ct">${Object.entries(g).map(([n,k])=>esc(n)+(k>1?' ×'+k:'')).join(', ')||'—'}</td><td>${c.files.length?`<button class="ebtn">${T('Отменить')}</button>`:''}</td></tr>`}).join('')}</tbody></table>
    <div class="hint" style="margin-top:12px">${T('«Отменить» возвращает файлы этого сохранения в состояние до него — новым сохранением, поэтому отмену тоже можно отменить. Если эти же файлы меняли позже, более поздние правки в них тоже откатятся.')}</div>`;
  $('vw').querySelectorAll('tr[data-i] .ebtn').forEach(b=>b.onclick=()=>revert(HIST[+b.closest('tr').dataset.i]))}
async function revert(c){if(dirtyCount())return toast(T('Сначала сохраните или отмените несохранённые изменения'),true);
  const names=[...new Set(c.files.map(f=>fname(f.path)))].join(', ');
  if(!confirm(T('Отменить «{0}» от {1}?\n\nФайлы ({2}) вернутся к состоянию до этого сохранения. Более поздние правки этих файлов тоже откатятся.',c.msg.split('\n')[0],dt(c.date),names)))return;
  $('busy').classList.add('on');
  try{await api('/api/revert',{sha:c.sha});HIST=null;toast(T('Отменено. Сайт обновится примерно через 1–2 минуты.'));await load()}
  catch(e){toast(T('Не получилось отменить: {0}',e.message),true)}finally{$('busy').classList.remove('on')}}
/* переключение языка: перерисовать текущий экран, не трогая данные и несохранённые правки */
function applyStatic(){document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{if(!el.dataset.i18n)el.dataset.i18n=el.textContent;el.textContent=T(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{if(!el.dataset.i18nPh)el.dataset.i18nPh=el.placeholder;el.placeholder=T(el.dataset.i18nPh)});
  document.querySelectorAll('[data-i18n-ti]').forEach(el=>{if(!el.dataset.i18nTi)el.dataset.i18nTi=el.title;el.title=T(el.dataset.i18nTi)});
  document.querySelectorAll('.lsw button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG))}
function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem('tkAdmLang',l)}catch(e){}
  FILES.forEach(c=>FN[c.f]=cn(c));ddClose();applyStatic();dd($('fs'));navOrders();
  if(RU){fillFc();render();bar()}}
document.addEventListener('click',e=>{const b=e.target.closest('.lsw button');if(b)setLang(b.dataset.lang)});
applyStatic();dd($('fs'));navOrders();
if(TOK)load();else showLogin();
</script>
